name: Promote BFF to Cloud Run (production)

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full lowercase commit SHA for an image already built by the main dev workflow
        required: true
        type: string

env:
  PROJECT_ID: llm-wiki-cloud
  SERVICE_NAME: llm-wiki-bff
  REGION: asia-east1
  AR_REPO: asia-east1-docker.pkg.dev/llm-wiki-cloud/cloud-run-images
  PIPELINE_JOB_NAME: olw-pipeline
  RUNTIME_SERVICE_ACCOUNT: lwc-bff-prod@llm-wiki-cloud.iam.gserviceaccount.com
  BUCKET: llm-wiki-data
  FIRESTORE_DATABASE_ID: llm-wiki-cloud-prod
  JWT_SECRET_NAME: jwt-secret-prod
  DEEPSEEK_SECRET_NAME: deepseek-apikey
  ALLOWED_ORIGINS: https://wiki.rayer.idv.tw,https://llm-wiki-frontend.vercel.app

concurrency:
  group: promote-bff-production
  cancel-in-progress: false

jobs:
  promote:
    name: Promote immutable BFF image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      actions: read
      id-token: write

    steps:
      - name: Checkout main
        uses: actions/checkout@11d596a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize deployment evidence paths
        run: |
          set -euo pipefail
          EVIDENCE_DIR="$RUNNER_TEMP/bff-deployment-evidence"
          ROLLBACK_CONTRACT="$EVIDENCE_DIR/rollback-contract.json"
          METADATA="$EVIDENCE_DIR/metadata.json"
          EVIDENCE="$EVIDENCE_DIR/deployment-evidence.json"
          EVIDENCE_FAILURE="$EVIDENCE_DIR/deployment-evidence-failure.json"
          printf 'EVIDENCE_DIR=%s\nROLLBACK_CONTRACT=%s\nMETADATA=%s\nEVIDENCE=%s\nEVIDENCE_FAILURE=%s\n' \
            "$EVIDENCE_DIR" "$ROLLBACK_CONTRACT" "$METADATA" "$EVIDENCE" "$EVIDENCE_FAILURE" >> "$GITHUB_ENV"

      - name: Validate promotion commit
        id: commit
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be a 40-character lowercase commit SHA"
            exit 1
          fi
          git fetch origin main --force --no-tags
          if ! git cat-file -e "$COMMIT_SHA^{commit}"; then
            echo "commit_sha does not identify a commit"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$COMMIT_SHA" origin/main; then
            echo "commit_sha is not an ancestor of main"
            exit 1
          fi
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

      - name: Locate successful main dev deployment
        id: dev_run
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
        run: |
          set -euo pipefail
          RUN_JSON=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-bff.yml/runs?event=push&status=completed&head_sha=${COMMIT_SHA}&per_page=100" \
            | jq -ce --arg sha "$COMMIT_SHA" 'first(.workflow_runs[] | select(.event == "push" and .head_branch == "main" and .head_sha == $sha and .conclusion == "success")) // error("no successful main push run")')
          RUN_ID=$(jq -er '.id | select(type == "number" and . > 0)' <<<"$RUN_JSON")
          RUN_URL=$(jq -er '.html_url | select(type == "string" and startswith("https://"))' <<<"$RUN_JSON")
          RUN_EVENT=$(jq -er '.event | select(. == "push")' <<<"$RUN_JSON")
          RUN_HEAD_BRANCH=$(jq -er '.head_branch | select(. == "main")' <<<"$RUN_JSON")
          RUN_HEAD_SHA=$(jq -er --arg sha "$COMMIT_SHA" '.head_sha | select(. == $sha)' <<<"$RUN_JSON")
          RUN_CONCLUSION=$(jq -er '.conclusion | select(. == "success")' <<<"$RUN_JSON")
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run_url=$RUN_URL" >> "$GITHUB_OUTPUT"
          echo "run_event=$RUN_EVENT" >> "$GITHUB_OUTPUT"
          echo "run_head_branch=$RUN_HEAD_BRANCH" >> "$GITHUB_OUTPUT"
          echo "run_head_sha=$RUN_HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "run_conclusion=$RUN_CONCLUSION" >> "$GITHUB_OUTPUT"

      - name: Download exact dev image digest
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
          DEV_RUN_ID: ${{ steps.dev_run.outputs.run_id }}
        run: |
          set -euo pipefail
          ARTIFACT_DIR="$RUNNER_TEMP/bff-image-digest"
          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR"
          gh run download "$DEV_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "bff-image-digest-$COMMIT_SHA" \
            --dir "$ARTIFACT_DIR"
          DIGEST_FILE="$ARTIFACT_DIR/bff-image-digest-$COMMIT_SHA.txt"
          if [[ ! -f "$DIGEST_FILE" ]] || [[ $(find "$ARTIFACT_DIR" -type f | wc -l) -ne 1 ]]; then
            echo "digest artifact contents are missing or unexpected"
            exit 1
          fi
          DIGEST=$(tr -d '[:space:]' < "$DIGEST_FILE")
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "digest artifact is missing or invalid"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "image=${AR_REPO}/llm-wiki-bff@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v2.1.10
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.1.30
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify production IAM preflight
        run: |
          set -euo pipefail
          SERVICE_POLICY=$(gcloud run services get-iam-policy "$SERVICE_NAME" \
            --project "$PROJECT_ID" --region "$REGION" --format=json --quiet)
          if ! jq -e --arg member "allUsers" '
            if (.bindings | type) != "array" then false
            else ([.bindings[] | select(type == "object" and .role == "roles/run.invoker" and (.members | type) == "array" and (.members | index($member)))] | length == 1)
            end' <<<"$SERVICE_POLICY" >/dev/null; then
            echo "required production service IAM binding is missing or malformed; refusing to deploy"
            exit 1
          fi
          JOB_POLICY=$(gcloud run jobs get-iam-policy "$PIPELINE_JOB_NAME" \
            --project "$PROJECT_ID" --region "$REGION" --format=json --quiet)
          if ! jq -e --arg member "serviceAccount:${RUNTIME_SERVICE_ACCOUNT}" \
            'if (.bindings | type) != "array" then false
             else ([.bindings[] | select(type == "object" and .role == "roles/run.jobsExecutorWithOverrides" and (.members | type) == "array" and (.members | index($member)))] | length == 1)
             end' \
            <<<"$JOB_POLICY" >/dev/null; then
            echo "required production pipeline IAM binding is missing or malformed; refusing to deploy"
            exit 1
          fi

      - name: Freeze production rollback contract
        id: rollback
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          EVIDENCE_ARTIFACT_NAME="bff-deployment-evidence-${COMMIT_SHA}"
          python3 scripts/render_bff_deployment_evidence.py prepare-rollback \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --service-name "$SERVICE_NAME" \
            --pipeline-job-name "$PIPELINE_JOB_NAME" \
            --ar-repo "$AR_REPO" \
            --artifact-name "$EVIDENCE_ARTIFACT_NAME" \
            --output "$ROLLBACK_CONTRACT"
          echo "artifact_name=$EVIDENCE_ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Prepare validated deployment metadata before mutation
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
          IMMUTABLE_IMAGE: ${{ steps.image.outputs.image }}
          DEV_RUN_ID: ${{ steps.dev_run.outputs.run_id }}
          DEV_RUN_URL: ${{ steps.dev_run.outputs.run_url }}
          DEV_RUN_EVENT: ${{ steps.dev_run.outputs.run_event }}
          DEV_RUN_HEAD_BRANCH: ${{ steps.dev_run.outputs.run_head_branch }}
          DEV_RUN_HEAD_SHA: ${{ steps.dev_run.outputs.run_head_sha }}
          DEV_RUN_CONCLUSION: ${{ steps.dev_run.outputs.run_conclusion }}
          EVIDENCE_ARTIFACT_NAME: ${{ steps.rollback.outputs.artifact_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          jq -n \
            --arg project "$PROJECT_ID" \
            --arg component "lwc-bff" \
            --arg environment "production" \
            --arg action "promote" \
            --argjson schema_version 1 \
            --arg commit_sha "$COMMIT_SHA" \
            --arg source_ref "refs/heads/main" \
            --arg dev_workflow "deploy-bff.yml" \
            --arg dev_event "$DEV_RUN_EVENT" \
            --arg dev_head_branch "$DEV_RUN_HEAD_BRANCH" \
            --arg dev_head_sha "$DEV_RUN_HEAD_SHA" \
            --arg dev_conclusion "$DEV_RUN_CONCLUSION" \
            --argjson dev_run_id "$DEV_RUN_ID" \
            --arg dev_run_url "$DEV_RUN_URL" \
            --arg image "$IMMUTABLE_IMAGE" \
            --arg digest "${IMMUTABLE_IMAGE##*@}" \
            --arg rollback_artifact_name "$EVIDENCE_ARTIFACT_NAME" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --argjson workflow_run_id "$GITHUB_RUN_ID" \
            --argjson workflow_run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{schema_version: $schema_version, project: $project, component: $component, environment: $environment, action: $action, rollback_artifact_name: $rollback_artifact_name, source: {commit_sha: $commit_sha, ref: $source_ref}, dev_provenance: {workflow: $dev_workflow, event: $dev_event, head_branch: $dev_head_branch, head_sha: $dev_head_sha, conclusion: $dev_conclusion, run_id: $dev_run_id, run_url: $dev_run_url}, image: {digest: $digest, reference: $image}, originating_workflow: {repository: $repository, workflow: $workflow, run_id: $workflow_run_id, run_attempt: $workflow_run_attempt}}' \
            > "$METADATA"
          python3 scripts/render_bff_deployment_evidence.py validate-metadata \
            --project "$PROJECT_ID" --region "$REGION" --service-name "$SERVICE_NAME" \
            --pipeline-job-name "$PIPELINE_JOB_NAME" --ar-repo "$AR_REPO" \
            --metadata "$METADATA"

      - name: Deploy existing immutable image to Cloud Run
        env:
          IMMUTABLE_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE_NAME" \
            --project "$PROJECT_ID" \
            --image "$IMMUTABLE_IMAGE" \
            --region "$REGION" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --network default --subnet default \
            --vpc-egress private-ranges-only \
            --ingress all \
            --update-secrets "JWT_SECRET=${JWT_SECRET_NAME}:latest,DEEPSEEK_API_KEY=${DEEPSEEK_SECRET_NAME}:latest" \
            --update-env-vars "^@^GCP_PROJECT=${PROJECT_ID}@BUCKET=${BUCKET}@FIRESTORE_DATABASE_ID=${FIRESTORE_DATABASE_ID}@PIPELINE_JOB_URL=https://run.googleapis.com/v2/projects/${PROJECT_ID}/locations/${REGION}/jobs/${PIPELINE_JOB_NAME}:run@ALLOWED_ORIGINS=${ALLOWED_ORIGINS}@DEV_JWT=false" \
            --quiet

      - name: Render normalized deployment evidence after strict read-back
        env:
          IMMUTABLE_IMAGE: ${{ steps.image.outputs.image }}
          EXPECTED_RUNTIME_SERVICE_ACCOUNT: ${{ env.RUNTIME_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          # The renderer performs an unauthenticated GET /api/v1/public/version.
          python3 scripts/render_bff_deployment_evidence.py render-evidence \
            --project "$PROJECT_ID" --region "$REGION" --service-name "$SERVICE_NAME" \
            --pipeline-job-name "$PIPELINE_JOB_NAME" --ar-repo "$AR_REPO" \
            --expected-runtime-service-account "$EXPECTED_RUNTIME_SERVICE_ACCOUNT" \
            --rollback-contract "$ROLLBACK_CONTRACT" --metadata "$METADATA" \
            --output "$EVIDENCE" --failure-output "$EVIDENCE_FAILURE"

      - name: Finalize partial evidence when provider verification is unknown
        if: always()
        run: |
          set -euo pipefail
          if [[ -e "$EVIDENCE" ]]; then
            echo "verified or partial evidence already exists; preserving it"
          elif [[ -f "$ROLLBACK_CONTRACT" && -f "$METADATA" ]]; then
            python3 scripts/render_bff_deployment_evidence.py render-partial \
              --project "$PROJECT_ID" --region "$REGION" --service-name "$SERVICE_NAME" \
              --pipeline-job-name "$PIPELINE_JOB_NAME" --ar-repo "$AR_REPO" \
              --rollback-contract "$ROLLBACK_CONTRACT" --metadata "$METADATA" \
              --output "$EVIDENCE" --failure-output "$EVIDENCE_FAILURE"
          else
            echo "rollback or validated metadata is unavailable; no evidence fabricated"
          fi

      - name: Upload normalized deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.rollback.outputs.artifact_name }}
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error
          retention-days: 90

      - name: Tag promoted production image
        if: success()
        env:
          IMMUTABLE_IMAGE: ${{ steps.image.outputs.image }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
        run: |
          set -euo pipefail
          if [[ ! -f "$EVIDENCE" ]] || [[ "$(jq -r '.status // empty' "$EVIDENCE")" != "HEALTHY" ]]; then
            echo "verified evidence is unavailable; refusing to tag the promoted image"
            exit 1
          fi
          gcloud artifacts docker tags add \
            "$IMMUTABLE_IMAGE" \
            "${AR_REPO}/llm-wiki-bff:prod-${COMMIT_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --quiet
