name: Promote BFF to Cloud Run (production)

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full lowercase commit SHA for an image built by canonical develop
        required: true
        type: string
      dev_run_id:
        description: Exact successful DEV deployment run ID for this commit SHA
        required: true
        type: string

env:
  PROJECT_ID: llm-wiki-cloud
  SERVICE_NAME: llm-wiki-bff
  REGION: asia-east1
  AR_REPO: asia-east1-docker.pkg.dev/llm-wiki-cloud/cloud-run-images
  QUERY_STAGE_CONFIG_PATH: /app/configs/query/dev/query-dev-2026-08-21.2.json
  QUERY_STAGE_CONFIG_REVISION: query-dev-2026-08-21.2
  QUERY_STAGE_CONFIG_DIGEST: sha256:75e4f76de991b496c503b42fd893d34408ddae726fe99003365a5c89b8e46642
  PIPELINE_JOB_NAME: olw-pipeline
  RUNTIME_SERVICE_ACCOUNT: lwc-bff-prod@llm-wiki-cloud.iam.gserviceaccount.com
  BUCKET: llm-wiki-data
  FIRESTORE_DATABASE_ID: llm-wiki-cloud-prod
  JWT_SECRET_NAME: jwt-secret-prod
  DEEPSEEK_SECRET_NAME: deepseek-apikey
  ALLOWED_ORIGINS: https://wiki.rayer.idv.tw,https://llm-wiki-frontend.vercel.app

concurrency:
  group: promote-bff-production
  cancel-in-progress: false

jobs:
  promote:
    name: Promote immutable BFF image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    permissions:
      contents: read
      actions: read
      id-token: write

    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize deployment evidence paths
        run: |
          set -euo pipefail
          EVIDENCE_DIR="$RUNNER_TEMP/bff-deployment-evidence"
          ROLLBACK_CONTRACT="$EVIDENCE_DIR/rollback-contract.json"
          METADATA="$EVIDENCE_DIR/metadata.json"
          EVIDENCE="$EVIDENCE_DIR/deployment-evidence.json"
          EVIDENCE_FAILURE="$EVIDENCE_DIR/deployment-evidence-failure.json"
          DEV_RUN_JSON="$EVIDENCE_DIR/dev-run.json"
          DEV_JOBS_JSON="$EVIDENCE_DIR/dev-jobs.json"
          printf 'EVIDENCE_DIR=%s\nROLLBACK_CONTRACT=%s\nMETADATA=%s\nEVIDENCE=%s\nEVIDENCE_FAILURE=%s\n' \
            "$EVIDENCE_DIR" "$ROLLBACK_CONTRACT" "$METADATA" "$EVIDENCE" "$EVIDENCE_FAILURE" >> "$GITHUB_ENV"
          printf 'DEV_RUN_JSON=%s\nDEV_JOBS_JSON=%s\n' "$DEV_RUN_JSON" "$DEV_JOBS_JSON" >> "$GITHUB_ENV"

      - name: Validate promotion commit
        id: commit
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be a 40-character lowercase commit SHA"
            exit 1
          fi
          if ! git cat-file -e "$COMMIT_SHA^{commit}"; then
            echo "commit_sha does not identify a commit"
            exit 1
          fi
          MAIN_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
          if [[ "$MAIN_SHA" != "$COMMIT_SHA" ]]; then
            echo "current main must exactly equal commit_sha"
            exit 1
          fi
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

      - name: Locate exact successful canonical develop DEV deployment
        id: dev_run
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
          DEV_RUN_ID: ${{ inputs.dev_run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$DEV_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "dev_run_id must be a positive integer"
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${DEV_RUN_ID}" > "$DEV_RUN_JSON"
          echo "run_id=$DEV_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Validate exact successful DEV promotion jobs
        env:
          GH_TOKEN: ${{ github.token }}
          DEV_RUN_ID: ${{ steps.dev_run.outputs.run_id }}
        run: |
          set -euo pipefail
          PAGES_FILE="$DEV_JOBS_JSON.pages"
          rm -f "$PAGES_FILE"
          TOTAL=""
          COLLECTED=0
          PAGE=1
          while :; do
            RESPONSE=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${DEV_RUN_ID}/jobs?per_page=100&page=${PAGE}")
            PAGE_TOTAL=$(jq -er '.total_count | select(type == "number" and . >= 0 and floor == .)' <<<"$RESPONSE")
            PAGE_JOBS=$(jq -cer '.jobs | select(type == "array")' <<<"$RESPONSE")
            PAGE_COUNT=$(jq -er 'length' <<<"$PAGE_JOBS")
            if [[ -z "$TOTAL" ]]; then
              TOTAL="$PAGE_TOTAL"
            elif [[ "$TOTAL" != "$PAGE_TOTAL" ]]; then
              echo "DEV run job count changed while fetching evidence"
              exit 1
            fi
            printf '%s\n' "$PAGE_JOBS" >> "$PAGES_FILE"
            COLLECTED=$((COLLECTED + PAGE_COUNT))
            if (( COLLECTED == TOTAL )); then
              jq -s 'add' "$PAGES_FILE" > "$DEV_JOBS_JSON"
              rm -f "$PAGES_FILE"
              break
            fi
            if (( COLLECTED > TOTAL || PAGE_COUNT == 0 )); then
              echo "DEV run jobs listing was incomplete or malformed"
              exit 1
            fi
            PAGE=$((PAGE + 1))
          done
          python3 scripts/validate_bff_promotion_contract.py validate-run-jobs \
            --jobs-json "$DEV_JOBS_JSON" \
            --expected-run-id "$DEV_RUN_ID"

      - name: Download exact DEV receipt and readiness evidence
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
          DEV_RUN_ID: ${{ steps.dev_run.outputs.run_id }}
        run: |
          set -euo pipefail
          ARTIFACT_DIR="$RUNNER_TEMP/bff-image-digest"
          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR"
          gh run download "$DEV_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "bff-image-digest-$COMMIT_SHA" \
            --dir "$ARTIFACT_DIR"
          gh run download "$DEV_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "bff-production-promotion-ready-$COMMIT_SHA" \
            --dir "$ARTIFACT_DIR"
          DIGEST_FILE="$ARTIFACT_DIR/bff-image-digest-$COMMIT_SHA.txt"
          READINESS_FILE="$ARTIFACT_DIR/bff-production-promotion-ready.json"
          if [[ ! -f "$DIGEST_FILE" || ! -f "$READINESS_FILE" ]] || [[ $(find "$ARTIFACT_DIR" -type f | wc -l) -ne 2 ]]; then
            echo "DEV receipt or readiness artifact contents are missing or unexpected"
            exit 1
          fi
          python3 scripts/validate_bff_promotion_contract.py validate-dev-receipt \
            --receipt "$DIGEST_FILE" \
            --run-json "$DEV_RUN_JSON" \
            --expected-sha "$COMMIT_SHA" \
            --expected-run-id "$DEV_RUN_ID" \
            --expected-branch develop \
            --expected-event workflow_dispatch \
            --lifecycle production \
            --component lwc-bff \
            --repository "$GITHUB_REPOSITORY" \
            --ar-repo "$AR_REPO" \
            --query-config-revision "$QUERY_STAGE_CONFIG_REVISION" \
            --query-config-digest "$QUERY_STAGE_CONFIG_DIGEST" \
            --output "$RUNNER_TEMP/validated-bff-dev-receipt.json" \
            --github-output "$GITHUB_OUTPUT"
          python3 scripts/validate_bff_promotion_contract.py validate-production-readiness \
            --readiness "$READINESS_FILE" \
            --expected-sha "$COMMIT_SHA" \
            --expected-run-id "$DEV_RUN_ID" \
            --expected-branch develop \
            --component lwc-bff \
            --repository "$GITHUB_REPOSITORY" \
            --ar-repo "$AR_REPO" \
            --receipt "$DIGEST_FILE"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify production IAM preflight
        run: |
          set -euo pipefail
          SERVICE_POLICY=$(gcloud run services get-iam-policy "$SERVICE_NAME" \
            --project "$PROJECT_ID" --region "$REGION" --format=json --quiet)
          if ! jq -e --arg member "allUsers" '
            if (.bindings | type) != "array" then false
            else ([.bindings[] | select(type == "object" and .role == "roles/run.invoker" and (.members | type) == "array" and (.members | index($member)))] | length == 1)
            end' <<<"$SERVICE_POLICY" >/dev/null; then
            echo "required production service IAM binding is missing or malformed; refusing to deploy"
            exit 1
          fi
          JOB_POLICY=$(gcloud run jobs get-iam-policy "$PIPELINE_JOB_NAME" \
            --project "$PROJECT_ID" --region "$REGION" --format=json --quiet)
          if ! jq -e --arg member "serviceAccount:${RUNTIME_SERVICE_ACCOUNT}" \
            'if (.bindings | type) != "array" then false
             else ([.bindings[] | select(type == "object" and .role == "roles/run.jobsExecutorWithOverrides" and (.members | type) == "array" and (.members | index($member)))] | length == 1)
             end' \
            <<<"$JOB_POLICY" >/dev/null; then
            echo "required production pipeline IAM binding is missing or malformed; refusing to deploy"
            exit 1
          fi

      - name: Freeze production rollback contract
        id: rollback
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          ROLLBACK_ARTIFACT_NAME="bff-rollback-contract-${COMMIT_SHA}"
          EVIDENCE_ARTIFACT_NAME="bff-deployment-evidence-${COMMIT_SHA}"
          python3 scripts/render_bff_deployment_evidence.py prepare-rollback \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --service-name "$SERVICE_NAME" \
            --pipeline-job-name "$PIPELINE_JOB_NAME" \
            --ar-repo "$AR_REPO" \
            --artifact-name "$ROLLBACK_ARTIFACT_NAME" \
            --output "$ROLLBACK_CONTRACT"
          echo "rollback_artifact_name=$ROLLBACK_ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "evidence_artifact_name=$EVIDENCE_ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Prepare validated deployment metadata before mutation
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
          IMMUTABLE_IMAGE: ${{ steps.image.outputs.image }}
          DEV_RUN_ID: ${{ steps.image.outputs.dev_run_id }}
          DEV_RUN_URL: ${{ steps.image.outputs.dev_run_url }}
          DEV_RUN_EVENT: ${{ steps.image.outputs.dev_run_event }}
          DEV_RUN_HEAD_BRANCH: ${{ steps.image.outputs.dev_run_head_branch }}
          DEV_RUN_HEAD_SHA: ${{ steps.image.outputs.dev_run_head_sha }}
          DEV_RUN_CONCLUSION: ${{ steps.image.outputs.dev_run_conclusion }}
          BUILD_REF: ${{ steps.image.outputs.build_ref }}
          ROLLBACK_ARTIFACT_NAME: ${{ steps.rollback.outputs.rollback_artifact_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          jq -n \
            --arg project "$PROJECT_ID" \
            --arg component "lwc-bff" \
            --arg environment "production" \
            --arg action "promote" \
            --argjson schema_version 1 \
            --arg commit_sha "$COMMIT_SHA" \
            --arg source_ref "refs/heads/main" \
            --arg build_ref "$BUILD_REF" \
            --arg production_source_ref "main" \
            --arg dev_workflow "deploy-bff.yml" \
            --arg dev_event "$DEV_RUN_EVENT" \
            --arg dev_head_branch "$DEV_RUN_HEAD_BRANCH" \
            --arg dev_head_sha "$DEV_RUN_HEAD_SHA" \
            --arg dev_conclusion "$DEV_RUN_CONCLUSION" \
            --argjson dev_run_id "$DEV_RUN_ID" \
            --arg dev_run_url "$DEV_RUN_URL" \
            --arg image "$IMMUTABLE_IMAGE" \
            --arg digest "${IMMUTABLE_IMAGE##*@}" \
            --arg rollback_artifact_name "$ROLLBACK_ARTIFACT_NAME" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --argjson workflow_run_id "$GITHUB_RUN_ID" \
            --argjson workflow_run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{schema_version: $schema_version, project: $project, component: $component, environment: $environment, action: $action, rollback_artifact_name: $rollback_artifact_name, build_ref: $build_ref, production_source_ref: $production_source_ref, source: {commit_sha: $commit_sha, ref: $source_ref}, dev_provenance: {workflow: $dev_workflow, event: $dev_event, head_branch: $dev_head_branch, head_sha: $dev_head_sha, conclusion: $dev_conclusion, run_id: $dev_run_id, run_url: $dev_run_url}, image: {digest: $digest, reference: $image}, originating_workflow: {repository: $repository, workflow: $workflow, run_id: $workflow_run_id, run_attempt: $workflow_run_attempt}}' \
            > "$METADATA"
          python3 scripts/render_bff_deployment_evidence.py validate-metadata \
            --project "$PROJECT_ID" --region "$REGION" --service-name "$SERVICE_NAME" \
            --pipeline-job-name "$PIPELINE_JOB_NAME" --ar-repo "$AR_REPO" \
            --metadata "$METADATA"

      - name: Upload immutable rollback contract
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.rollback.outputs.rollback_artifact_name }}
          path: ${{ env.ROLLBACK_CONTRACT }}
          if-no-files-found: error
          retention-days: 90

      - name: Validate frozen rollback traffic before mutation
        run: |
          set -euo pipefail
          FROZEN_READY_REVISION=$(jq -er '.ready_revision | select(type == "string" and length > 0)' "$ROLLBACK_CONTRACT")
          if ! python3 scripts/validate_bff_promotion_contract.py validate-traffic \
            --traffic-file "$ROLLBACK_CONTRACT" \
            --traffic-path traffic \
            --traffic-mode artifact \
            --recognized-revision "$FROZEN_READY_REVISION"; then
            echo "frozen rollback traffic is not one recognized immutable 100-percent target"
            exit 1
          fi
          SERVICE_JSON=$(gcloud run services describe "$SERVICE_NAME" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --format=json \
            --quiet)
          if ! jq -e --arg ready_revision "$FROZEN_READY_REVISION" \
            '.status.latestCreatedRevisionName == $ready_revision and .status.latestReadyRevisionName == $ready_revision' \
            <<<"$SERVICE_JSON" >/dev/null; then
            echo "live rollback state no longer matches the frozen ready revision or authoritative traffic"
            exit 1
          fi
          if ! printf '%s\n' "$SERVICE_JSON" | python3 scripts/validate_bff_promotion_contract.py validate-traffic \
            --traffic-file - \
            --traffic-path status.traffic \
            --traffic-mode provider-pre-mutation \
            --recognized-revision "$FROZEN_READY_REVISION"; then
            echo "live rollback traffic is not one recognized immutable 100-percent target"
            exit 1
          fi
          FROZEN_CREATED_REVISION=$(jq -er '.status.latestCreatedRevisionName | select(type == "string" and length > 0)' <<<"$SERVICE_JSON")
          echo "FROZEN_CREATED_REVISION=$FROZEN_CREATED_REVISION" >> "$GITHUB_ENV"
          echo "frozen rollback traffic is supported"

      - name: Deploy existing immutable image to Cloud Run
        id: deploy
        env:
          IMMUTABLE_IMAGE: ${{ steps.image.outputs.image }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "deploy_started=true" >> "$GITHUB_OUTPUT"
          MAIN_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
          if [[ "$MAIN_SHA" != "$COMMIT_SHA" ]]; then
            echo "current main changed before deploy; refusing to mutate production"
            exit 1
          fi
          gcloud run deploy "$SERVICE_NAME" \
            --project "$PROJECT_ID" \
            --image "$IMMUTABLE_IMAGE" \
            --region "$REGION" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --network default --subnet default \
            --vpc-egress private-ranges-only \
            --ingress all \
            --update-secrets "JWT_SECRET=${JWT_SECRET_NAME}:latest,DEEPSEEK_API_KEY=${DEEPSEEK_SECRET_NAME}:latest" \
            --remove-env-vars "QUERY_EXPANSION_MODEL,QUERY_EXPANSION_REASONING,ANSWER_SYNTHESIS_MODEL,ANSWER_SYNTHESIS_REASONING,QUERY_SELECTION_LIMIT,QUERY_SELECTION_EXPLORATION_SLOTS,QUERY_SELECTION_EVIDENCE_THRESHOLD,QUERY_EXPANSION_KEYWORDS_PER_ATTEMPT,QUERY_EXPANSION_ATTEMPTS,QUERY_MATCHING_RARE_KEYWORD_MAX_DOCUMENT_FREQUENCY" \
            --update-env-vars "^@^GCP_PROJECT=${PROJECT_ID}@BUCKET=${BUCKET}@FIRESTORE_DATABASE_ID=${FIRESTORE_DATABASE_ID}@PIPELINE_JOB_URL=https://run.googleapis.com/v2/projects/${PROJECT_ID}/locations/${REGION}/jobs/${PIPELINE_JOB_NAME}:run@ALLOWED_ORIGINS=${ALLOWED_ORIGINS}@QUERY_STAGE_CONFIG_PATH=${QUERY_STAGE_CONFIG_PATH}@DEV_JWT=false" \
            --quiet

      - name: Verify deployed query config readback
        id: query_config_readback
        env:
          EXPECTED_COMMIT: ${{ steps.commit.outputs.commit_sha }}
        run: |
          set -euo pipefail
          SERVICE_URL=$(gcloud run services describe "$SERVICE_NAME" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --format='value(status.url)' \
            --quiet)
          if [[ ! "$SERVICE_URL" =~ ^https://llm-wiki-bff-[a-z0-9-]+\.a\.run\.app$ ]]; then
            echo "Cloud Run returned an invalid public service URL or host; refusing to verify readback."
            exit 1
          fi
          FROZEN_READY_REVISION=$(jq -er '.ready_revision | select(type == "string" and length > 0)' "$ROLLBACK_CONTRACT")
          FROZEN_CREATED_REVISION="${FROZEN_CREATED_REVISION:?}"
          CREATED_REVISION=""
          READBACK_REVISION_DEADLINE=$((SECONDS + 300))
          while (( SECONDS < READBACK_REVISION_DEADLINE )); do
            SERVICE_JSON=$(gcloud run services describe "$SERVICE_NAME" \
              --region "$REGION" \
              --project "$PROJECT_ID" \
              --format=json \
              --quiet) || true
            CANDIDATE_REVISION=$(jq -er '.status.latestCreatedRevisionName | select(type == "string" and length > 0)' <<<"$SERVICE_JSON" 2>/dev/null || true)
            if [[ -z "$CREATED_REVISION" && -n "$CANDIDATE_REVISION" ]]; then
              if [[ "$CANDIDATE_REVISION" != "$FROZEN_CREATED_REVISION" ]]; then
                CREATED_REVISION="$CANDIDATE_REVISION"
              fi
            fi
            if [[ -n "$CREATED_REVISION" ]] \
              && [[ "$CANDIDATE_REVISION" == "$CREATED_REVISION" ]] \
              && jq -e --arg revision "$CREATED_REVISION" \
                '.status.latestCreatedRevisionName == $revision and .status.latestReadyRevisionName == $revision' <<<"$SERVICE_JSON" >/dev/null; then
              EXPECTED_REVISION="$CREATED_REVISION"
              break
            fi
            sleep 5
          done
          if [[ -z "${EXPECTED_REVISION:-}" ]]; then
            echo "the exact created production revision did not become authoritative within timeout"
            exit 1
          fi
          BODY_FILE=$(mktemp)
          HEADER_FILE=$(mktemp)
          trap 'rm -f "$BODY_FILE" "$HEADER_FILE"' EXIT
          HTTP_STATUS=""
          READBACK_VALID=0
          READBACK_DEADLINE=$((SECONDS + 300))
          while (( SECONDS < READBACK_DEADLINE )); do
            : > "$BODY_FILE"
            : > "$HEADER_FILE"
            HTTP_STATUS=$(curl --silent --show-error --proto '=https' \
              --connect-timeout 5 --max-time 10 \
              --dump-header "$HEADER_FILE" --output "$BODY_FILE" \
              --write-out '%{http_code}' \
              "$SERVICE_URL/api/v1/query/config" || true)
            if [[ "$HTTP_STATUS" == "200" ]] \
              && grep -Eiq '^cache-control:[[:space:]]*no-store([[:space:]]*;.*)?[[:space:]]*$' "$HEADER_FILE" \
              && jq -e --arg revision "$QUERY_STAGE_CONFIG_REVISION" \
                --arg digest "$QUERY_STAGE_CONFIG_DIGEST" \
                --arg commit "$EXPECTED_COMMIT" \
                --arg cloud_revision "$EXPECTED_REVISION" \
                --arg service "$SERVICE_NAME" '
                  ((. | keys | sort) == ["build", "query_config"])
                  and ((.build | keys | sort) == ["commit", "revision", "service"])
                  and ((.query_config | keys | sort) == ["config_digest", "config_revision", "default_profile_digest", "default_profile_id", "default_prompt_digest", "default_prompt_id", "expansion_model", "expansion_provider", "expansion_reasoning", "expansion_temperature", "options", "query_service_implementation", "schema_version", "synthesis_model", "synthesis_provider", "synthesis_reasoning", "synthesis_temperature"])
                  and ((.query_config.options | keys | sort) == ["evidence_threshold", "expansion_attempts", "exploration_slots", "keywords_per_attempt", "rare_document_frequency", "selection_limit"])
                  and .query_config.schema_version == 2
                  and .query_config.config_revision == $revision
                  and .query_config.config_digest == $digest
                  and .query_config.query_service_implementation == "query-retrieval-pipeline-v2"
                  and .query_config.expansion_provider == "deepseek"
                  and .query_config.expansion_model == "deepseek-v4-flash"
                  and .query_config.expansion_reasoning == "none"
                  and .query_config.expansion_temperature == 0
                  and .query_config.synthesis_provider == "deepseek"
                  and .query_config.synthesis_model == "deepseek-v4-pro"
                  and .query_config.synthesis_reasoning == "none"
                  and .query_config.synthesis_temperature == 0
                  and .query_config.options.selection_limit == 10
                  and .query_config.options.exploration_slots == 1
                  and .query_config.options.evidence_threshold == 2
                  and .query_config.options.keywords_per_attempt == 24
                  and .query_config.options.expansion_attempts == 3
                  and .query_config.options.rare_document_frequency == 1
                  and .build.commit == $commit
                  and .build.revision == $cloud_revision
                  and .build.service == $service
                ' "$BODY_FILE" \
              && ! grep -Eiq 'project_id|generation_id|concepts_digest|binding_count|distinct_service_composition_count|system_template|user_template|api[_-]?key|credential' "$BODY_FILE"; then
              READBACK_VALID=1
              break
            fi
            sleep 10
          done
          if [[ "$HTTP_STATUS" != "200" || "$READBACK_VALID" != "1" ]]; then
            echo "public query config readback identity/schema is invalid or did not return HTTP 200 (last status: ${HTTP_STATUS:-empty})"
            exit 1
          fi
          if ! grep -Eiq '^cache-control:[[:space:]]*no-store([[:space:]]*;.*)?[[:space:]]*$' "$HEADER_FILE"; then
            echo "public query config readback did not return Cache-Control: no-store"
            exit 1
          fi
          jq -er '.query_config.config_revision' "$BODY_FILE" | { read value; echo "config_revision=$value" >> "$GITHUB_OUTPUT"; }
          jq -er '.query_config.config_digest' "$BODY_FILE" | { read value; echo "config_digest=$value" >> "$GITHUB_OUTPUT"; }

      - name: Restore frozen production traffic after query-config readback failure
        if: ${{ always() && steps.deploy.outputs.deploy_started == 'true' && (steps.deploy.outcome == 'failure' || steps.query_config_readback.outcome == 'failure') }}
        run: |
          set -euo pipefail
          FROZEN_READY_REVISION=$(jq -er '.ready_revision | select(type == "string" and length > 0)' "$ROLLBACK_CONTRACT")
          validate_frozen_rollback_traffic() {
            python3 scripts/validate_bff_promotion_contract.py validate-traffic \
              --traffic-file "$ROLLBACK_CONTRACT" \
              --traffic-path traffic \
              --traffic-mode artifact \
              --recognized-revision "$FROZEN_READY_REVISION"
          }
          validate_restored_effective_traffic() {
            printf '%s\n' "$1" | python3 scripts/validate_bff_promotion_contract.py validate-traffic \
              --traffic-file - \
              --traffic-path status.traffic \
              --traffic-mode provider-post-rollback \
              --recognized-revision "$FROZEN_READY_REVISION" \
              --expected-revision "$FROZEN_READY_REVISION"
          }
          validate_effective_traffic() {
            local revision
            revision=$(jq -er '
              .status as $status
              | if ($status.latestReadyRevisionName | type) == "string"
                and ($status.traffic | type) == "array"
                and ($status.traffic | length) == 1
                and $status.traffic[0].revisionName == $status.latestReadyRevisionName
                then $status.latestReadyRevisionName
                else empty
                end
            ' <<<"$1") || return 1
            printf '%s\n' "$1" | python3 scripts/validate_bff_promotion_contract.py validate-traffic \
              --traffic-file - \
              --traffic-path status.traffic \
              --traffic-mode provider-pre-mutation \
              --recognized-revision "$revision"
          }
          validate_frozen_effective_traffic() {
            validate_restored_effective_traffic "$1"
          }
          validate_frozen_rollback_traffic
          if ! SERVICE_JSON=$(gcloud run services describe "$SERVICE_NAME" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --format=json \
            --quiet); then
            echo "provider traffic readback is unavailable, unsupported, or ambiguous; refusing to guess or write"
            exit 1
          fi
          if ! validate_effective_traffic "$SERVICE_JSON"; then
            echo "provider traffic readback is unavailable, unsupported, or ambiguous; refusing to guess or write"
            exit 1
          fi
          if validate_frozen_effective_traffic "$SERVICE_JSON"; then
            echo "live production traffic is already the frozen revision; no restore needed; preserving workflow failure"
            exit 1
          fi
          echo "live production traffic differs from the frozen revision; restoring explicit frozen production traffic"
          set +e
          gcloud run services update-traffic "$SERVICE_NAME" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --to-revisions "${FROZEN_READY_REVISION}=100" \
            --quiet
          ROLLBACK_EXIT=$?
          set -e
          ROLLBACK_READBACK_DEADLINE=$((SECONDS + 240))
          RESTORED=0
          while (( SECONDS < ROLLBACK_READBACK_DEADLINE )); do
            if SERVICE_JSON=$(gcloud run services describe "$SERVICE_NAME" \
              --region "$REGION" \
              --project "$PROJECT_ID" \
              --format=json \
              --quiet); then
              RESTORED_EFFECTIVE_REVISION=$(jq -er '.status.traffic[0].revisionName' <<<"$SERVICE_JSON")
              RESTORED_EFFECTIVE_PERCENT=$(jq -er '.status.traffic[0].percent' <<<"$SERVICE_JSON")
              if validate_restored_effective_traffic "$SERVICE_JSON"; then
                RESTORED=1
                break
              fi
            fi
            sleep 5
          done
          if [[ "$RESTORED" != "1" ]]; then
            echo "frozen production traffic was not authoritative within timeout (update exit $ROLLBACK_EXIT)"
            exit 1
          fi
          echo "restored effective routing: ${RESTORED_EFFECTIVE_REVISION}=${RESTORED_EFFECTIVE_PERCENT} (update exit $ROLLBACK_EXIT); preserving workflow failure"
          exit 1

      - name: Render normalized deployment evidence after strict read-back
        env:
          IMMUTABLE_IMAGE: ${{ steps.image.outputs.image }}
          EXPECTED_RUNTIME_SERVICE_ACCOUNT: ${{ env.RUNTIME_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          # The renderer performs an unauthenticated GET /api/v1/public/version.
          python3 scripts/render_bff_deployment_evidence.py render-evidence \
            --project "$PROJECT_ID" --region "$REGION" --service-name "$SERVICE_NAME" \
            --pipeline-job-name "$PIPELINE_JOB_NAME" --ar-repo "$AR_REPO" \
            --expected-runtime-service-account "$EXPECTED_RUNTIME_SERVICE_ACCOUNT" \
            --rollback-contract "$ROLLBACK_CONTRACT" --metadata "$METADATA" \
            --output "$EVIDENCE" --failure-output "$EVIDENCE_FAILURE"

      - name: Finalize partial evidence when provider verification is unknown
        if: always()
        run: |
          set -euo pipefail
          if [[ -e "$EVIDENCE" ]]; then
            echo "verified or partial evidence already exists; preserving it"
          elif [[ -f "$ROLLBACK_CONTRACT" && -f "$METADATA" ]]; then
            python3 scripts/render_bff_deployment_evidence.py render-partial \
              --project "$PROJECT_ID" --region "$REGION" --service-name "$SERVICE_NAME" \
              --pipeline-job-name "$PIPELINE_JOB_NAME" --ar-repo "$AR_REPO" \
              --rollback-contract "$ROLLBACK_CONTRACT" --metadata "$METADATA" \
              --output "$EVIDENCE" --failure-output "$EVIDENCE_FAILURE"
          else
            echo "rollback or validated metadata is unavailable; no evidence fabricated"
          fi

      - name: Upload normalized deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.rollback.outputs.evidence_artifact_name }}
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error
          retention-days: 90
