name: Deploy BFF to Cloud Run (dev)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full lowercase commit SHA to deploy from canonical develop
        required: true
        type: string

env:
  PROJECT_ID: llm-wiki-cloud
  SERVICE_NAME: llm-wiki-bff-dev
  REGION: asia-east1
  AR_REPO: asia-east1-docker.pkg.dev/llm-wiki-cloud/cloud-run-images

concurrency:
  group: deploy-bff-dev
  cancel-in-progress: false

jobs:
  test-and-deploy:
    name: Test & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate deployment source
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$REF" != "refs/heads/develop" || "$REF_NAME" != "develop" ]]; then
              echo "manual deployment must use the canonical develop branch"
              exit 1
            fi
            if [[ ! "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "commit_sha must be a 40-character lowercase commit SHA"
              exit 1
            fi
            CANDIDATE_SHA="$COMMIT_SHA"
            git fetch origin develop --force --no-tags
            REMOTE_DEVELOP_SHA=$(git rev-parse origin/develop)
            if [[ "$CANDIDATE_SHA" != "$REMOTE_DEVELOP_SHA" ]]; then
              echo "input commit SHA does not match current origin/develop"
              exit 1
            fi
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "github.sha must be a 40-character lowercase commit SHA"
              exit 1
            fi
            CANDIDATE_SHA="$GITHUB_SHA"
          else
            echo "unsupported deployment event: $EVENT_NAME"
            exit 1
          fi
          CHECKED_OUT_SHA=$(git rev-parse HEAD)
          if [[ "$CANDIDATE_SHA" != "$CHECKED_OUT_SHA" ]]; then
            echo "input commit SHA does not match checked-out HEAD"
            exit 1
          fi
          echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Run Go tests
        run: go test ./... -count=1

      - name: Run Go vet
        run: go vet ./...

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify existing dev IAM prerequisites
        run: |
          set -euo pipefail
          if ! JOB_IAM_POLICY=$(gcloud run jobs get-iam-policy "olw-pipeline-dev" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --format=json \
            --quiet); then
            echo "unable to read IAM policy for olw-pipeline-dev; refusing to deploy"
            exit 1
          fi
          if ! jq -e --arg member "serviceAccount:lwc-bff-dev@llm-wiki-cloud.iam.gserviceaccount.com" \
            'any(.bindings[]?; .role == "roles/run.jobsExecutorWithOverrides" and any(.members[]?; . == $member))' \
            <<<"$JOB_IAM_POLICY" >/dev/null; then
            echo "pipeline Job IAM policy does not grant the required executor role; refusing to deploy"
            exit 1
          fi

          if ! SERVICE_IAM_POLICY=$(gcloud run services get-iam-policy "${{ env.SERVICE_NAME }}" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --format=json \
            --quiet); then
            echo "unable to read IAM policy for ${{ env.SERVICE_NAME }}; refusing to deploy"
            exit 1
          fi
          if ! jq -e \
            'any(.bindings[]?; .role == "roles/run.invoker" and any(.members[]?; . == "allUsers"))' \
            <<<"$SERVICE_IAM_POLICY" >/dev/null; then
            echo "BFF service IAM policy does not grant the required public invoker role; refusing to deploy"
            exit 1
          fi

      - name: Resolve build identity
        id: identity
        run: |
          set -euo pipefail
          APP_VERSION=$(go run ./cmd/versioncheck VERSION)
          GIT_SHA=$(git rev-parse HEAD)
          if [[ ! "$GIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GIT_SHA must be a 40-character lowercase commit SHA"
            exit 1
          fi
          GIT_BRANCH="${GITHUB_REF_NAME}"
          if [[ ! "$GIT_BRANCH" =~ ^[0-9A-Za-z][0-9A-Za-z._/-]*$ ]]; then
            echo "GIT_BRANCH is invalid: $GIT_BRANCH"
            exit 1
          fi
          mapfile -t exact_tags < <(git tag --points-at HEAD --format='%(refname:strip=2)')
          if (( ${#exact_tags[@]} > 1 )); then
            echo "multiple exact git tags point at HEAD"
            exit 1
          fi
          GIT_TAG="${exact_tags[0]:-}"
          if [[ -n "$GIT_TAG" && ! "$GIT_TAG" =~ ^[0-9A-Za-z][0-9A-Za-z._/-]*$ ]]; then
            echo "GIT_TAG is invalid: $GIT_TAG"
            exit 1
          fi
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "git_sha=$GIT_SHA" >> "$GITHUB_OUTPUT"
          echo "git_branch=$GIT_BRANCH" >> "$GITHUB_OUTPUT"
          echo "git_tag=$GIT_TAG" >> "$GITHUB_OUTPUT"

      - name: Build and deploy to Cloud Run
        id: build
        env:
          BUCKET: llm-wiki-data-dev
          FIRESTORE_DATABASE_ID: llm-wiki-cloud-dev
          QUERY_EXPANSION_MODEL: deepseek-v4-flash
          QUERY_EXPANSION_REASONING: none
          ANSWER_SYNTHESIS_MODEL: deepseek-v4-pro
          ANSWER_SYNTHESIS_REASONING: none
          QUERY_SELECTION_LIMIT: 10
          QUERY_SELECTION_EXPLORATION_SLOTS: 1
          QUERY_SELECTION_EVIDENCE_THRESHOLD: 2
          QUERY_EXPANSION_KEYWORDS_PER_ATTEMPT: 24
          QUERY_EXPANSION_ATTEMPTS: 3
          QUERY_MATCHING_RARE_KEYWORD_MAX_DOCUMENT_FREQUENCY: 1
          PIPELINE_JOB_NAME: olw-pipeline-dev
          RUNTIME_SERVICE_ACCOUNT: lwc-bff-dev@llm-wiki-cloud.iam.gserviceaccount.com
          JWT_SECRET_NAME: jwt-secret-dev
          ALLOWED_ORIGINS: https://wiki.dev.rayer.idv.tw,https://llm-wiki-frontend-dev.vercel.app,http://localhost:3000,http://127.0.0.1:3000
          APP_VERSION: ${{ steps.identity.outputs.app_version }}
          GIT_SHA: ${{ steps.identity.outputs.git_sha }}
          GIT_BRANCH: ${{ steps.identity.outputs.git_branch }}
          GIT_TAG: ${{ steps.identity.outputs.git_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "previous_revision=" >> "$GITHUB_OUTPUT"
          echo "new_revision=" >> "$GITHUB_OUTPUT"
          echo "traffic_mutated=false" >> "$GITHUB_OUTPUT"

          validate_exact_traffic() {
            local revision="$1"
            local service_json="$2"
            jq -e --arg revision "$revision" '
              .status.traffic as $status
              | .spec.traffic as $spec
              | ((($status | type) == "array") and (($status | length) == 1)
                and (($spec | type) == "array") and (($spec | length) == 1)
                and (($status[0].percent // 0) == 100)
                and (($spec[0].percent // 0) == 100)
                and (($status[0].latestRevision // false) == false)
                and (($spec[0].latestRevision // false) == false)
                and (($status[0].revisionName // "") == $revision)
                and (($spec[0].revisionName // "") == $revision)
                and (($status[0].revisionName // "") == ($spec[0].revisionName // ""))
                and (($status[0].tag // "") == "")
                and (($spec[0].tag // "") == ""))' <<<"$service_json"
          }

          verify_revision() {
            local revision="$1"
            local image_reference="$2"
            local revision_json="${3:-}"
            if [[ -z "$revision_json" ]]; then
              if ! revision_json=$(gcloud run revisions describe "$revision" \
                --region "${{ env.REGION }}" \
                --project "${{ env.PROJECT_ID }}" \
                --format=json \
                --quiet); then
                echo "Unable to read revision $revision; refusing to deploy."
                return 1
              fi
            fi
            if ! jq -e --arg image "$image_reference" '
              (.status.imageDigest // "") == $image and
              (.status.conditions | type) == "array" and
              any(.status.conditions[]?; .type == "Ready" and .status == "True") and
              any(.status.conditions[]?; .type == "ContainerReady" and .status == "True")
            ' <<<"$revision_json"; then
              echo "Revision $revision is not running immutable image $image_reference with ready container state."
              return 1
            fi
          }

          rollback_traffic() {
            local target_revision="$1"
            local deadline=$((SECONDS + 240))
            set +e
            gcloud run services update-traffic "${{ env.SERVICE_NAME }}" \
              --to-revisions "${target_revision}=100" \
              --region "${{ env.REGION }}" \
              --project "${{ env.PROJECT_ID }}" \
              --quiet
            ROLLBACK_EXIT=$?
            set -e

            while (( SECONDS < deadline )); do
              if SERVICE_JSON=$(gcloud run services describe "${{ env.SERVICE_NAME }}" \
                --region "${{ env.REGION }}" \
                --project "${{ env.PROJECT_ID }}" \
                --format=json \
                --quiet) && validate_exact_traffic "$target_revision" "$SERVICE_JSON"; then
                return 0
              fi
              sleep 5
            done
            echo "Traffic restore to $target_revision did not become authoritative within timeout (update exit $ROLLBACK_EXIT)."
            return 1
          }

          IMAGE="${{ env.AR_REPO }}/llm-wiki-bff:$GIT_SHA"
          echo "Building ${IMAGE}…"
          BUILD_ID=$(gcloud builds submit \
            --config cloudbuild-bff.yaml \
            --substitutions="_IMAGE=$IMAGE,_APP_VERSION=$APP_VERSION,_GIT_SHA=$GIT_SHA,_GIT_BRANCH=$GIT_BRANCH,_GIT_TAG=$GIT_TAG" \
            --timeout=600s \
            --async \
            --suppress-logs \
            --format='value(id)' \
            --quiet)
          if [[ ! "$BUILD_ID" =~ ^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$ ]]; then
            echo "Cloud Build submission returned an invalid build ID: $BUILD_ID"
            exit 1
          fi
          echo "Submitted Cloud Build $BUILD_ID; waiting for completion…"

          STATUS=""
          # Cloud Build's default queue TTL is 3600s; add the 600s build
          # timeout and a 120s polling buffer so valid queued builds can finish.
          POLL_DEADLINE=$((SECONDS + 4320))
          while (( SECONDS < POLL_DEADLINE )); do
            if ! STATUS=$(gcloud builds describe "$BUILD_ID" \
              --project="${{ env.PROJECT_ID }}" \
              --format='value(status)' \
              --quiet); then
              echo "Unable to read Cloud Build $BUILD_ID status; failing closed."
              exit 1
            fi
            case "$STATUS" in
              SUCCESS)
                echo "Cloud Build $BUILD_ID completed successfully."
                break
                ;;
              PENDING|QUEUED|WORKING)
                sleep 15
                ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED|STATUS_UNKNOWN|UNKNOWN|"")
                echo "Cloud Build $BUILD_ID ended with status '${STATUS:-empty}'; refusing to deploy."
                exit 1
                ;;
              *)
                echo "Cloud Build $BUILD_ID returned unknown status '$STATUS'; refusing to deploy."
                exit 1
                ;;
            esac
          done
          if [[ "$STATUS" != SUCCESS ]]; then
            echo "Timed out waiting for Cloud Build $BUILD_ID after 4320 seconds; refusing to deploy."
            exit 1
          fi

          if ! BUILD_RESULT=$(gcloud builds describe "$BUILD_ID" \
            --project="${{ env.PROJECT_ID }}" \
            --format=json \
            --quiet); then
            echo "Unable to read successful Cloud Build $BUILD_ID result; failing closed."
            exit 1
          fi
          if ! RESULT_IMAGES=$(jq -cer --arg image "$IMAGE" \
            '[.results.images[]? | select(.name == $image)]' <<<"$BUILD_RESULT"); then
            echo "Cloud Build $BUILD_ID returned an unreadable image result; failing closed."
            exit 1
          fi
          RESULT_IMAGE_COUNT=$(jq -er 'length' <<<"$RESULT_IMAGES")
          if [[ "$RESULT_IMAGE_COUNT" != "1" ]]; then
            echo "Cloud Build $BUILD_ID returned $RESULT_IMAGE_COUNT image results for $IMAGE; refusing to deploy."
            exit 1
          fi
          DIGEST=$(jq -er '.[0].digest' <<<"$RESULT_IMAGES")
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Cloud Build $BUILD_ID returned an invalid image digest; refusing to deploy."
            exit 1
          fi
          IMMUTABLE_IMAGE="${{ env.AR_REPO }}/llm-wiki-bff@$DIGEST"

          if ! SERVICE_JSON=$(gcloud run services describe "${{ env.SERVICE_NAME }}" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --format=json \
            --quiet); then
            echo "Unable to read ${{ env.SERVICE_NAME }} before mutation; refusing to deploy."
            exit 1
          fi

          if ! PREVIOUS_ROLLBACK_REVISION=$(jq -er '.status.traffic[0].revisionName // empty' <<<"$SERVICE_JSON"); then
            echo "Cloud Run service did not have a rollback revision in status traffic."
            exit 1
          fi
          if ! validate_exact_traffic "$PREVIOUS_ROLLBACK_REVISION" "$SERVICE_JSON"; then
            echo "Cloud Run service did not have exactly one explicit non-tagged 100% serving revision in both spec and status before deploy."
            exit 1
          fi
          if ! PREVIOUS_ROLLBACK_REVISION_JSON=$(gcloud run revisions describe "$PREVIOUS_ROLLBACK_REVISION" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --format=json \
            --quiet); then
            echo "Unable to read previous rollback revision $PREVIOUS_ROLLBACK_REVISION."
            exit 1
          fi
          if ! PREVIOUS_ROLLBACK_IMAGE=$(jq -er '.status.imageDigest // empty' <<<"$PREVIOUS_ROLLBACK_REVISION_JSON"); then
            echo "Unable to read image digest for previous rollback revision $PREVIOUS_ROLLBACK_REVISION."
            exit 1
          fi
          EXPECTED_IMAGE_PREFIX="${{ env.AR_REPO }}/llm-wiki-bff@"
          if [[ "$PREVIOUS_ROLLBACK_IMAGE" != "$EXPECTED_IMAGE_PREFIX"* ]]; then
            echo "Previous rollback revision $PREVIOUS_ROLLBACK_REVISION is not immutable."
            exit 1
          fi
          PREVIOUS_ROLLBACK_DIGEST="${PREVIOUS_ROLLBACK_IMAGE#"$EXPECTED_IMAGE_PREFIX"}"
          if [[ ! "$PREVIOUS_ROLLBACK_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Previous rollback revision $PREVIOUS_ROLLBACK_REVISION is not immutable."
            exit 1
          fi
          if ! verify_revision "$PREVIOUS_ROLLBACK_REVISION" "$PREVIOUS_ROLLBACK_IMAGE" "$PREVIOUS_ROLLBACK_REVISION_JSON"; then
            echo "Previous rollback revision $PREVIOUS_ROLLBACK_REVISION was not ready."
            exit 1
          fi

          if ! PREVIOUS_CREATED_REVISION=$(jq -r '.status.latestCreatedRevisionName // empty' <<<"$SERVICE_JSON"); then
            echo "Cloud Run did not return latest created revision information; refusing to deploy."
            exit 1
          fi

          if ! REMOTE_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${GITHUB_REF_NAME}" --jq .object.sha); then
            echo "Unable to read remote ${GITHUB_REF_NAME}; refusing to deploy."
            exit 1
          fi
          if [[ ! "$REMOTE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Remote ${GITHUB_REF_NAME} returned an invalid commit SHA; refusing to deploy."
            exit 1
          fi
          if [[ "$REMOTE_SHA" != "$GIT_SHA" ]]; then
            echo "Remote ${GITHUB_REF_NAME} no longer matches the deployment commit; refusing to deploy."
            exit 1
          fi

          echo "Deploying ${IMMUTABLE_IMAGE}…"
          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --image "$IMMUTABLE_IMAGE" \
            --no-traffic \
            --region "${{ env.REGION }}" \
            --service-account "${{ env.RUNTIME_SERVICE_ACCOUNT }}" \
            --network default --subnet default \
            --vpc-egress private-ranges-only \
            --max-instances 1 \
            --update-secrets "JWT_SECRET=${{ env.JWT_SECRET_NAME }}:latest,DEEPSEEK_API_KEY=deepseek-apikey:latest" \
            --update-env-vars "^@^GCP_PROJECT=${{ env.PROJECT_ID }}@BUCKET=${{ env.BUCKET }}@FIRESTORE_DATABASE_ID=${{ env.FIRESTORE_DATABASE_ID }}@PIPELINE_JOB_URL=https://run.googleapis.com/v2/projects/${{ env.PROJECT_ID }}/locations/${{ env.REGION }}/jobs/${{ env.PIPELINE_JOB_NAME }}:run@ALLOWED_ORIGINS=${{ env.ALLOWED_ORIGINS }}@AUTH_SERVICE_URL=https://auth.dev.rayer.idv.tw@QUERY_EXPANSION_MODEL=${{ env.QUERY_EXPANSION_MODEL }}@QUERY_EXPANSION_REASONING=${{ env.QUERY_EXPANSION_REASONING }}@ANSWER_SYNTHESIS_MODEL=${{ env.ANSWER_SYNTHESIS_MODEL }}@ANSWER_SYNTHESIS_REASONING=${{ env.ANSWER_SYNTHESIS_REASONING }}@QUERY_SELECTION_LIMIT=${{ env.QUERY_SELECTION_LIMIT }}@QUERY_SELECTION_EXPLORATION_SLOTS=${{ env.QUERY_SELECTION_EXPLORATION_SLOTS }}@QUERY_SELECTION_EVIDENCE_THRESHOLD=${{ env.QUERY_SELECTION_EVIDENCE_THRESHOLD }}@QUERY_EXPANSION_KEYWORDS_PER_ATTEMPT=${{ env.QUERY_EXPANSION_KEYWORDS_PER_ATTEMPT }}@QUERY_EXPANSION_ATTEMPTS=${{ env.QUERY_EXPANSION_ATTEMPTS }}@QUERY_MATCHING_RARE_KEYWORD_MAX_DOCUMENT_FREQUENCY=${{ env.QUERY_MATCHING_RARE_KEYWORD_MAX_DOCUMENT_FREQUENCY }}@DEV_JWT=false" \
            --quiet

          CREATED_REVISION=""
          CREATED_REVISION_DEADLINE=$((SECONDS + 600))
          while ((SECONDS < CREATED_REVISION_DEADLINE)); do
            if ! SERVICE_JSON=$(gcloud run services describe "${{ env.SERVICE_NAME }}" \
              --region "${{ env.REGION }}" \
              --project "${{ env.PROJECT_ID }}" \
              --format=json \
              --quiet); then
              echo "Unable to read service after deploy."
              exit 1
            fi
            CREATED_REVISION=$(jq -r '.status.latestCreatedRevisionName // empty' <<<"$SERVICE_JSON")
            if [[ -n "$CREATED_REVISION" && "$CREATED_REVISION" != "$PREVIOUS_CREATED_REVISION" ]]; then
              break
            fi
            sleep 10
          done
          if [[ -z "$CREATED_REVISION" || "$CREATED_REVISION" == "$PREVIOUS_CREATED_REVISION" ]]; then
            echo "Cloud Run did not report a new latest created revision; refusing to deploy."
            exit 1
          fi
          if ! verify_revision "$CREATED_REVISION" "$IMMUTABLE_IMAGE"; then
            echo "Cloud Run did not create a ready revision with the expected immutable image."
            exit 1
          fi

          if ! SERVICE_JSON=$(gcloud run services describe "${{ env.SERVICE_NAME }}" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --format=json \
            --quiet); then
            echo "Unable to re-read ${{ env.SERVICE_NAME }} before cutover; refusing to deploy."
            exit 1
          fi
          if ! validate_exact_traffic "$PREVIOUS_ROLLBACK_REVISION" "$SERVICE_JSON"; then
            echo "Cloud Run traffic changed before cutover; refusing to mutate traffic."
            exit 1
          fi

          echo "previous_revision=$PREVIOUS_ROLLBACK_REVISION" >> "$GITHUB_OUTPUT"
          echo "new_revision=$CREATED_REVISION" >> "$GITHUB_OUTPUT"
          echo "traffic_mutated=true" >> "$GITHUB_OUTPUT"

          CUTOVER_VERIFIED=0
          set +e
          gcloud run services update-traffic "${{ env.SERVICE_NAME }}" \
            --to-revisions "${CREATED_REVISION}=100" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --quiet
          CUTOVER_EXIT=$?
          if (( CUTOVER_EXIT == 0 )); then
            VERIFY_DEADLINE=$((SECONDS + 600))
            while ((SECONDS < VERIFY_DEADLINE)); do
              if SERVICE_JSON=$(gcloud run services describe "${{ env.SERVICE_NAME }}" \
                --region "${{ env.REGION }}" \
                --project "${{ env.PROJECT_ID }}" \
                --format=json \
                --quiet) \
                && validate_exact_traffic "$CREATED_REVISION" "$SERVICE_JSON" \
                && jq -e --arg revision "$CREATED_REVISION" \
                  '(.status.latestReadyRevisionName // "") == $revision' \
                  <<<"$SERVICE_JSON" \
                && verify_revision "$CREATED_REVISION" "$IMMUTABLE_IMAGE"; then
                CUTOVER_VERIFIED=1
                break
              fi
              sleep 10
            done
          fi
          set -e

          if (( CUTOVER_EXIT != 0 || CUTOVER_VERIFIED != 1 )); then
            echo "Cutover failed; attempting bounded rollback to $PREVIOUS_ROLLBACK_REVISION."
            if ! rollback_traffic "$PREVIOUS_ROLLBACK_REVISION"; then
              echo "Rollback to $PREVIOUS_ROLLBACK_REVISION failed; refusing to continue."
              exit 1
            else
              echo "traffic_mutated=false" >> "$GITHUB_OUTPUT"
              echo "Rollback to $PREVIOUS_ROLLBACK_REVISION succeeded."
            fi
            exit 1
          fi

          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "immutable_image=$IMMUTABLE_IMAGE" >> "$GITHUB_OUTPUT"
          echo "✅ Deployed ${{ env.SERVICE_NAME }} ($GIT_SHA) to $CREATED_REVISION"

      - name: Persist build image digest
        id: image_digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          COMMIT_SHA="${{ steps.identity.outputs.git_sha }}"
          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "built commit SHA must be a 40-character lowercase commit SHA"
            exit 1
          fi
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Cloud Build image digest is missing or invalid"
            exit 1
          fi
          DIGEST_FILE="bff-image-digest-$COMMIT_SHA.txt"
          printf '%s\n' "$DIGEST" > "$DIGEST_FILE"
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "digest_file=$DIGEST_FILE" >> "$GITHUB_OUTPUT"
          echo "Persisted Cloud Build image digest $DIGEST"

      - name: Upload image digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: bff-image-digest-${{ steps.image_digest.outputs.commit_sha }}
          path: ${{ steps.image_digest.outputs.digest_file }}
          if-no-files-found: error

      - name: Tag deployed dev image (fail-closed)
        env:
          IMMUTABLE_IMAGE: ${{ env.AR_REPO }}/llm-wiki-bff@${{ steps.image_digest.outputs.digest }}
        run: |
          set -euo pipefail
          DEV_IMAGE_TAG="${{ env.AR_REPO }}/llm-wiki-bff:dev-${{ steps.identity.outputs.git_sha }}"
          gcloud artifacts docker tags add \
            "$IMMUTABLE_IMAGE" \
            "$DEV_IMAGE_TAG" \
            --quiet

      - name: Show deployment info
        run: |
          gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --format="value(status.url)"

      - name: Restore BFF traffic on post-cutover failure
        if: ${{ always() && failure() && steps.build.outputs.traffic_mutated == 'true' }}
        run: |
          set -euo pipefail
          PREVIOUS_REVISION="${{ steps.build.outputs.previous_revision }}"
          NEW_REVISION="${{ steps.build.outputs.new_revision }}"
          if [[ -z "$PREVIOUS_REVISION" || -z "$NEW_REVISION" ]]; then
            echo "Cannot restore BFF traffic without validated rollback context."
            exit 1
          fi
          echo "Rolling back traffic from $NEW_REVISION to $PREVIOUS_REVISION."

          validate_exact_traffic() {
            local revision="$1"
            local service_json="$2"
            jq -e --arg revision "$revision" '
              .status.traffic as $status
              | .spec.traffic as $spec
              | ((($status | type) == "array") and (($status | length) == 1)
                and (($spec | type) == "array") and (($spec | length) == 1)
                and (($status[0].percent // 0) == 100)
                and (($spec[0].percent // 0) == 100)
                and (($status[0].latestRevision // false) == false)
                and (($spec[0].latestRevision // false) == false)
                and (($status[0].revisionName // "") == $revision)
                and (($spec[0].revisionName // "") == $revision)
                and (($status[0].revisionName // "") == ($spec[0].revisionName // ""))
                and (($status[0].tag // "") == "")
                and (($spec[0].tag // "") == ""))' <<<"$service_json"
          }

          if ! SERVICE_JSON=$(gcloud run services describe "${{ env.SERVICE_NAME }}" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --format=json \
            --quiet); then
            echo "Unable to read service before cleanup; refusing to mutate traffic."
            exit 1
          fi
          if validate_exact_traffic "$PREVIOUS_REVISION" "$SERVICE_JSON"; then
            echo "BFF traffic is already on $PREVIOUS_REVISION; cleanup is a no-op."
            exit 0
          fi
          if ! validate_exact_traffic "$NEW_REVISION" "$SERVICE_JSON"; then
            echo "BFF traffic is neither on $PREVIOUS_REVISION nor $NEW_REVISION; refusing to mutate traffic."
            exit 1
          fi

          set +e
          gcloud run services update-traffic "${{ env.SERVICE_NAME }}" \
            --to-revisions "${PREVIOUS_REVISION}=100" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --quiet
          ROLLBACK_EXIT=$?
          set -e

          DEADLINE=$((SECONDS + 240))
          while ((SECONDS < DEADLINE)); do
            if SERVICE_JSON=$(gcloud run services describe "${{ env.SERVICE_NAME }}" \
              --region "${{ env.REGION }}" \
              --project "${{ env.PROJECT_ID }}" \
              --format=json \
              --quiet) && validate_exact_traffic "$PREVIOUS_REVISION" "$SERVICE_JSON"; then
              echo "Rolled back BFF traffic to $PREVIOUS_REVISION with exact serving traffic."
              exit 0
            fi
            sleep 5
          done
          echo "Traffic rollback to $PREVIOUS_REVISION did not become authoritative within timeout (update exit $ROLLBACK_EXIT)."
          exit 1
