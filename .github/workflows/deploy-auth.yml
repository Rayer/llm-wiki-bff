name: Deploy Auth to Cloud Run (dev)

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full lowercase commit SHA to deploy from canonical develop
        required: true
        type: string

env:
  PROJECT_ID: llm-wiki-cloud
  SERVICE_NAME: llm-wiki-auth-dev
  REGION: asia-east1
  AR_REPO: asia-east1-docker.pkg.dev/llm-wiki-cloud/cloud-run-images
  AUTH_DOMAIN: auth.dev.rayer.idv.tw
  LEGACY_AUTH_DOMAIN: auth-dev.rayer.idv.tw

concurrency:
  group: deploy-auth-dev
  cancel-in-progress: false

jobs:
  test-and-deploy:
    name: Test & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 80

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate deployment source
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "Auth deployment is manual-only"
            exit 1
          fi
          if [[ "$REF_NAME" != "develop" || "$REF" != "refs/heads/develop" ]]; then
            echo "manual deployment must use the canonical develop branch"
            exit 1
          fi
          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be a 40-character lowercase commit SHA"
            exit 1
          fi
          CANDIDATE_SHA="$COMMIT_SHA"
          git fetch origin develop --force --no-tags
          REMOTE_DEVELOP_SHA=$(git rev-parse origin/develop)
          if [[ "$CANDIDATE_SHA" != "$REMOTE_DEVELOP_SHA" ]]; then
            echo "input commit SHA does not match current origin/develop"
            exit 1
          fi
          CHECKED_OUT_SHA=$(git rev-parse HEAD)
          if [[ "$CANDIDATE_SHA" != "$CHECKED_OUT_SHA" ]]; then
            echo "input commit SHA does not match checked-out HEAD"
            exit 1
          fi
          echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Run Go tests
        run: go test ./... -count=1

      - name: Run Go vet
        run: go vet ./...

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_components: beta

      - name: Verify existing dev Auth prerequisites
        run: |
          set -euo pipefail
          RUNTIME_SERVICE_ACCOUNT="lwc-auth-dev@llm-wiki-cloud.iam.gserviceaccount.com"
          JWT_SECRET_NAME="jwt-secret-dev"
          FIRESTORE_DATABASE_ID="llm-wiki-cloud-dev"

          if ! gcloud iam service-accounts describe "$RUNTIME_SERVICE_ACCOUNT" \
            --project "${{ env.PROJECT_ID }}" \
            --format=json \
            --quiet >/dev/null; then
            echo "runtime service account $RUNTIME_SERVICE_ACCOUNT is missing or unreadable; refusing to deploy"
            exit 1
          fi

          if ! gcloud artifacts repositories describe "cloud-run-images" \
            --location "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --format=json \
            --quiet >/dev/null; then
            echo "Artifact Registry repository cloud-run-images is missing or unreadable; refusing to deploy"
            exit 1
          fi

          if ! gcloud firestore databases describe \
            --database "$FIRESTORE_DATABASE_ID" \
            --project "${{ env.PROJECT_ID }}" \
            --format=json \
            --quiet >/dev/null; then
            echo "Firestore database $FIRESTORE_DATABASE_ID is missing or unreadable; refusing to deploy"
            exit 1
          fi

          if ! gcloud secrets describe "$JWT_SECRET_NAME" \
            --project "${{ env.PROJECT_ID }}" \
            --format=json \
            --quiet >/dev/null; then
            echo "JWT secret $JWT_SECRET_NAME is missing or unreadable; refusing to deploy"
            exit 1
          fi

          if ! SECRET_IAM_POLICY=$(gcloud secrets get-iam-policy "$JWT_SECRET_NAME" \
            --project "${{ env.PROJECT_ID }}" \
            --format=json \
            --quiet); then
            echo "unable to read IAM policy for secret $JWT_SECRET_NAME; refusing to deploy"
            exit 1
          fi
          if ! jq -e --arg member "serviceAccount:$RUNTIME_SERVICE_ACCOUNT" \
            'any(.bindings[]?; .role == "roles/secretmanager.secretAccessor" and any(.members[]?; . == $member))' \
            <<<"$SECRET_IAM_POLICY" >/dev/null; then
            echo "JWT secret IAM policy does not grant the runtime service account access; refusing to deploy"
            exit 1
          fi

          if ! SERVICE_IAM_POLICY=$(gcloud run services get-iam-policy "${{ env.SERVICE_NAME }}" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --format=json \
            --quiet); then
            echo "unable to read IAM policy for ${{ env.SERVICE_NAME }}; refusing to deploy"
            exit 1
          fi
          if ! jq -e \
            'any(.bindings[]?; .role == "roles/run.invoker" and any(.members[]?; . == "allUsers"))' \
            <<<"$SERVICE_IAM_POLICY" >/dev/null; then
            echo "Auth service IAM policy does not grant the required public invoker role; refusing to deploy"
            exit 1
          fi

          if ! DOMAIN_MAPPING=$(gcloud beta run domain-mappings describe \
            --domain "$AUTH_DOMAIN" \
            --region "${{ env.REGION }}" \
            --platform managed \
            --project "${{ env.PROJECT_ID }}" \
            --format=json \
            --quiet); then
            echo "Auth domain mapping $AUTH_DOMAIN is missing or unreadable; refusing to deploy"
            exit 1
          fi
          if ! jq -e --arg service "${{ env.SERVICE_NAME }}" '.spec.routeName == $service' <<<"$DOMAIN_MAPPING" >/dev/null; then
            echo "Auth domain mapping $AUTH_DOMAIN does not target ${{ env.SERVICE_NAME }}; refusing to deploy"
            exit 1
          fi

          if ! SERVICE_JSON=$(gcloud run services describe "${{ env.SERVICE_NAME }}" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --format=json \
            --quiet); then
            echo "Auth service ${{ env.SERVICE_NAME }} is missing or unreadable; refusing to deploy"
            exit 1
          fi
          if ! jq -er '(.metadata.annotations["run.googleapis.com/ingress"] // "all") | select(. == "all")' <<<"$SERVICE_JSON" >/dev/null; then
            echo "Auth service ingress is not public; refusing to deploy"
            exit 1
          fi
          printf '%s\n' "$SERVICE_JSON" > auth-service-before.json

      - name: Resolve build identity
        id: identity
        run: |
          set -euo pipefail
          APP_VERSION=$(go run ./cmd/versioncheck VERSION)
          GIT_SHA=$(git rev-parse HEAD)
          if [[ ! "$GIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GIT_SHA must be a 40-character lowercase commit SHA"
            exit 1
          fi
          GIT_BRANCH="${GITHUB_REF_NAME}"
          if [[ ! "$GIT_BRANCH" =~ ^[0-9A-Za-z][0-9A-Za-z._/-]*$ ]]; then
            echo "GIT_BRANCH is invalid: $GIT_BRANCH"
            exit 1
          fi
          mapfile -t exact_tags < <(git tag --points-at HEAD --format='%(refname:strip=2)')
          if (( ${#exact_tags[@]} > 1 )); then
            echo "multiple exact git tags point at HEAD"
            exit 1
          fi
          GIT_TAG="${exact_tags[0]:-}"
          if [[ -n "$GIT_TAG" && ! "$GIT_TAG" =~ ^[0-9A-Za-z][0-9A-Za-z._/-]*$ ]]; then
            echo "GIT_TAG is invalid: $GIT_TAG"
            exit 1
          fi
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "git_sha=$GIT_SHA" >> "$GITHUB_OUTPUT"
          echo "git_branch=$GIT_BRANCH" >> "$GITHUB_OUTPUT"
          echo "git_tag=$GIT_TAG" >> "$GITHUB_OUTPUT"

      - name: Build Auth image
        id: build
        env:
          FIRESTORE_DATABASE_ID: llm-wiki-cloud-dev
          RUNTIME_SERVICE_ACCOUNT: lwc-auth-dev@llm-wiki-cloud.iam.gserviceaccount.com
          JWT_SECRET_NAME: jwt-secret-dev
          ALLOWED_ORIGINS: https://wiki.dev.rayer.idv.tw,https://llm-wiki-frontend-dev.vercel.app,http://localhost:3000
          APP_VERSION: ${{ steps.identity.outputs.app_version }}
          GIT_SHA: ${{ steps.identity.outputs.git_sha }}
          GIT_BRANCH: ${{ steps.identity.outputs.git_branch }}
          GIT_TAG: ${{ steps.identity.outputs.git_tag }}
        run: |
          set -euo pipefail
          IMAGE="${{ env.AR_REPO }}/llm-wiki-auth:$GIT_SHA"
          echo "Building ${IMAGE}…"
          BUILD_ID=$(gcloud builds submit \
            --config cloudbuild-auth.yaml \
            --substitutions="_IMAGE=$IMAGE,_APP_VERSION=$APP_VERSION,_GIT_SHA=$GIT_SHA,_GIT_BRANCH=$GIT_BRANCH,_GIT_TAG=$GIT_TAG" \
            --timeout=600s \
            --async \
            --suppress-logs \
            --format='value(id)' \
            --quiet)
          if [[ ! "$BUILD_ID" =~ ^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$ ]]; then
            echo "Cloud Build submission returned an invalid build ID: $BUILD_ID"
            exit 1
          fi
          echo "Submitted Cloud Build $BUILD_ID; waiting for completion…"

          STATUS=""
          # Cloud Build's default queue TTL is 3600s; add the 600s build
          # timeout and a 120s polling buffer so valid queued builds can finish.
          POLL_DEADLINE=$((SECONDS + 4320))
          while (( SECONDS < POLL_DEADLINE )); do
            if ! STATUS=$(gcloud builds describe "$BUILD_ID" \
              --project="${{ env.PROJECT_ID }}" \
              --format='value(status)' \
              --quiet); then
              echo "Unable to read Cloud Build $BUILD_ID status; failing closed."
              exit 1
            fi
            case "$STATUS" in
              SUCCESS)
                echo "Cloud Build $BUILD_ID completed successfully."
                break
                ;;
              PENDING|QUEUED|WORKING)
                sleep 15
                ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED|STATUS_UNKNOWN|UNKNOWN|"")
                echo "Cloud Build $BUILD_ID ended with status '${STATUS:-empty}'; refusing to deploy."
                exit 1
                ;;
              *)
                echo "Cloud Build $BUILD_ID returned unknown status '$STATUS'; refusing to deploy."
                exit 1
                ;;
            esac
          done
          if [[ "$STATUS" != SUCCESS ]]; then
            echo "Timed out waiting for Cloud Build $BUILD_ID after 4320 seconds; refusing to deploy."
            exit 1
          fi

          if ! BUILD_RESULT=$(gcloud builds describe "$BUILD_ID" \
            --project="${{ env.PROJECT_ID }}" \
            --format=json \
            --quiet); then
            echo "Unable to read successful Cloud Build $BUILD_ID result; failing closed."
            exit 1
          fi
          if ! RESULT_IMAGES=$(jq -cer --arg image "$IMAGE" \
            '[.results.images[]? | select(.name == $image)]' <<<"$BUILD_RESULT"); then
            echo "Cloud Build $BUILD_ID returned an unreadable image result; failing closed."
            exit 1
          fi
          RESULT_IMAGE_COUNT=$(jq -er 'length' <<<"$RESULT_IMAGES")
          if [[ "$RESULT_IMAGE_COUNT" != "1" ]]; then
            echo "Cloud Build $BUILD_ID returned $RESULT_IMAGE_COUNT image results for $IMAGE; refusing to deploy."
            exit 1
          fi
          DIGEST=$(jq -er '.[0].digest' <<<"$RESULT_IMAGES")
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Cloud Build $BUILD_ID returned an invalid image digest; refusing to deploy."
            exit 1
          fi
          IMMUTABLE_IMAGE="${{ env.AR_REPO }}/llm-wiki-auth@$DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "immutable_image=$IMMUTABLE_IMAGE" >> "$GITHUB_OUTPUT"


      - name: Capture pre-deploy Auth rollback evidence
        id: rollback
        env:
          AR_REPO: ${{ env.AR_REPO }}
          COMMIT_SHA: ${{ steps.identity.outputs.git_sha }}
          SERVICE_NAME: ${{ env.SERVICE_NAME }}
          IMMUTABLE_IMAGE: ${{ steps.build.outputs.immutable_image }}
        run: |
          set -euo pipefail
          if ! PREVIOUS_SERVING_REVISION=$(jq -er '
            .status.traffic as $traffic |
            if ($traffic | type) != "array" or ($traffic | length) != 1 then empty
            elif ($traffic[0].percent // 0) != 100 then empty
            elif (($traffic[0].revisionName // "") | type) != "string" or (($traffic[0].revisionName // "") | length) == 0 then empty
            elif ($traffic[0].tag? != null) then empty
            else $traffic[0].revisionName
            end
          ' auth-service-before.json); then
            echo "Cloud Run did not report exactly one untagged 100% serving revision; refusing to deploy."
            exit 1
          fi
          if ! PREVIOUS_REVISION_JSON=$(gcloud run revisions describe "$PREVIOUS_SERVING_REVISION" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --format=json \
            --quiet); then
            echo "Unable to read previous serving revision $PREVIOUS_SERVING_REVISION; refusing to deploy."
            exit 1
          fi
          if ! PREVIOUS_IMAGE=$(jq -er '.status.imageDigest' <<<"$PREVIOUS_REVISION_JSON"); then
            echo "Previous serving revision has no readable immutable image; refusing to deploy."
            exit 1
          fi
          IMAGE_PATTERN="^${AR_REPO}/llm-wiki-auth@sha256:[0-9a-f]{64}$"
          if [[ ! "$PREVIOUS_IMAGE" =~ $IMAGE_PATTERN ]]; then
            echo "Previous serving revision image is not an immutable full image reference; refusing to deploy."
            exit 1
          fi

          # previous version read-back proves the prior revision is an Auth-compatible rollback target.
          PREVIOUS_VERSION_BODY=$(mktemp)
          trap 'rm -f "$PREVIOUS_VERSION_BODY"' EXIT
          HTTP_STATUS=$(curl -sS --max-time 20 --connect-timeout 10 \
            -H 'Cache-Control: no-cache' \
            -o "$PREVIOUS_VERSION_BODY" \
            -w '%{http_code}' \
            "https://$LEGACY_AUTH_DOMAIN/api/v1/public/version")
          if [[ "$HTTP_STATUS" != "200" ]]; then
            echo "Previous Auth version read-back returned HTTP $HTTP_STATUS; refusing to deploy."
            exit 1
          fi
          if ! jq -e --arg service "$SERVICE_NAME" --arg revision "$PREVIOUS_SERVING_REVISION" \
            '.service == $service and .revision == $revision' "$PREVIOUS_VERSION_BODY" >/dev/null; then
            echo "Previous version read-back did not identify the exact Auth service and serving revision; refusing to deploy."
            exit 1
          fi
          PREVIOUS_VERSION_SERVICE=$(jq -er '.service' "$PREVIOUS_VERSION_BODY")
          PREVIOUS_VERSION_REVISION=$(jq -er '.revision' "$PREVIOUS_VERSION_BODY")
          if ! PREVIOUS_VERSION_COMMIT=$(jq -er '.commit | select(type == "string" and test("^[0-9a-f]{40}$"))' "$PREVIOUS_VERSION_BODY"); then
            echo "Previous Auth version read-back did not contain a lowercase 40-character commit; refusing to deploy."
            exit 1
          fi
          ROLLBACK_EVIDENCE="auth-rollback-evidence-$COMMIT_SHA.json"
          jq -n \
            --arg service "$SERVICE_NAME" \
            --arg domain "$AUTH_DOMAIN" \
            --arg commit "$COMMIT_SHA" \
            --arg previous_version_probe_domain "$LEGACY_AUTH_DOMAIN" \
            --arg previous_serving_revision "$PREVIOUS_SERVING_REVISION" \
            --arg previous_image "$PREVIOUS_IMAGE" \
            --arg previous_version_service "$PREVIOUS_VERSION_SERVICE" \
            --arg previous_version_revision "$PREVIOUS_VERSION_REVISION" \
            --arg previous_version_commit "$PREVIOUS_VERSION_COMMIT" \
            --arg built_image "$IMMUTABLE_IMAGE" \
            '{service: $service, domain: $domain, previous_version_probe_domain: $previous_version_probe_domain, exact_commit: $commit, previous_serving_revision: $previous_serving_revision, previous_image: $previous_image, previous_version_service: $previous_version_service, previous_version_revision: $previous_version_revision, previous_version_commit: $previous_version_commit, built_image: $built_image}' \
            > "$ROLLBACK_EVIDENCE"
          echo "rollback_evidence=$ROLLBACK_EVIDENCE" >> "$GITHUB_OUTPUT"

      - name: Upload pre-deploy Auth rollback evidence
        uses: actions/upload-artifact@v4
        with:
          name: auth-rollback-evidence-${{ steps.identity.outputs.git_sha }}
          path: ${{ steps.rollback.outputs.rollback_evidence }}
          if-no-files-found: error
          retention-days: 90

      - name: Deploy Auth to Cloud Run
        id: deploy
        env:
          FIRESTORE_DATABASE_ID: llm-wiki-cloud-dev
          RUNTIME_SERVICE_ACCOUNT: lwc-auth-dev@llm-wiki-cloud.iam.gserviceaccount.com
          JWT_SECRET_NAME: jwt-secret-dev
          ALLOWED_ORIGINS: https://wiki.dev.rayer.idv.tw,https://llm-wiki-frontend-dev.vercel.app,http://localhost:3000
          ALLOWED_HOSTS: auth.dev.rayer.idv.tw,auth-dev.rayer.idv.tw
          IMMUTABLE_IMAGE: ${{ steps.build.outputs.immutable_image }}
          GIT_SHA: ${{ steps.identity.outputs.git_sha }}
        run: |
          set -euo pipefail
          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --image "$IMMUTABLE_IMAGE" \
            --region "${{ env.REGION }}" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --network default --subnet default \
            --vpc-egress private-ranges-only \
            --ingress all \
            --max-instances 1 \
            --update-secrets "JWT_SECRET=$JWT_SECRET_NAME:latest" \
            --update-env-vars "^@^GCP_PROJECT=${{ env.PROJECT_ID }}@FIRESTORE_DATABASE_ID=$FIRESTORE_DATABASE_ID@ALLOWED_ORIGINS=$ALLOWED_ORIGINS@ALLOWED_HOSTS=$ALLOWED_HOSTS@DEV_JWT=false@LWC_SOURCE_COMMIT=$GIT_SHA" \
            --quiet
          gcloud run services update-traffic "${{ env.SERVICE_NAME }}" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --to-latest \
            --quiet
          echo "Deployed ${{ env.SERVICE_NAME }} ($GIT_SHA)"

      - name: Capture and verify Auth deployment evidence
        if: ${{ always() && steps.deploy.outcome != 'skipped' }}
        id: strict_verify
        env:
          AR_REPO: ${{ env.AR_REPO }}
          COMMIT_SHA: ${{ steps.identity.outputs.git_sha }}
          SERVICE_NAME: ${{ env.SERVICE_NAME }}
          IMMUTABLE_IMAGE: ${{ steps.build.outputs.immutable_image }}
        run: |
          set -euo pipefail
          EVIDENCE="auth-deployment-evidence-$COMMIT_SHA.json"
          EVIDENCE_TMP="$EVIDENCE.tmp"
          rm -f "$EVIDENCE" "$EVIDENCE_TMP" "$EVIDENCE_TMP.final"
          trap 'rm -f "$EVIDENCE_TMP" "$EVIDENCE_TMP.final"' EXIT
          if ! SERVICE_JSON=$(gcloud run services describe "$SERVICE_NAME" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --format=json \
            --quiet); then
            echo "Unable to read Auth service after deploy; refusing to publish evidence."
            exit 1
          fi
          if ! LATEST_CREATED_REVISION=$(jq -er '.status.latestCreatedRevisionName // empty' <<<"$SERVICE_JSON"); then
            echo "Cloud Run did not report a new latest created revision; refusing to publish evidence."
            exit 1
          fi
          if ! NEW_REVISION=$(jq -er '
            .status.traffic as $traffic |
            if ($traffic | type) != "array" or ($traffic | length) != 1 then empty
            elif (($traffic[0].percent // 0) != 100) then empty
            elif (($traffic[0].revisionName // "") | type) != "string" or (($traffic[0].revisionName // "") | length) == 0 then empty
            elif ($traffic[0].tag? != null) then empty
            else $traffic[0].revisionName
            end' <<<"$SERVICE_JSON"); then
            echo "Cloud Run did not report exactly one untagged 100% serving revision; refusing to publish evidence."
            exit 1
          fi
          if [[ "$NEW_REVISION" != "$LATEST_CREATED_REVISION" ]]; then
            echo "Auth service reported latest created revision $LATEST_CREATED_REVISION but serving revision $NEW_REVISION; refusing to publish evidence."
            exit 1
          fi
          if ! REVISION_JSON=$(gcloud run revisions describe "$NEW_REVISION" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --format=json \
            --quiet); then
            echo "Unable to read new revision $NEW_REVISION; refusing to publish evidence."
            exit 1
          fi
          if ! DEPLOYED_IMAGE_DIGEST=$(jq -er '.status.imageDigest' <<<"$REVISION_JSON"); then
            echo "New revision has no readable immutable image; refusing to publish evidence."
            exit 1
          fi
          IMAGE_PATTERN="^${AR_REPO}/llm-wiki-auth@sha256:[0-9a-f]{64}$"
          if [[ ! "$DEPLOYED_IMAGE_DIGEST" =~ $IMAGE_PATTERN || "$DEPLOYED_IMAGE_DIGEST" != "$IMMUTABLE_IMAGE" ]]; then
            echo "New revision image does not match the deployed immutable image; refusing to publish evidence."
            exit 1
          fi

          EXPECTED_RUNTIME_SERVICE_ACCOUNT="lwc-auth-dev@llm-wiki-cloud.iam.gserviceaccount.com"
          if ! RUNTIME_SERVICE_ACCOUNT=$(printf '%s\n%s\n' "$REVISION_JSON" "$SERVICE_JSON" | jq -s -er ' (.[0].spec.serviceAccountName // .[0].spec.serviceAccount // .[0].spec.serviceAccountEmail // .[1].spec.template.spec.serviceAccountName // .[1].spec.template.spec.serviceAccount // .[1].spec.template.spec.serviceAccountEmail // empty) | select(type == "string" and length > 0)'); then
            echo "New Auth revision runtime service account is unreadable; refusing to publish evidence."
            exit 1
          fi
          if [[ "$RUNTIME_SERVICE_ACCOUNT" != "$EXPECTED_RUNTIME_SERVICE_ACCOUNT" ]]; then
            echo "New Auth revision runtime service account mismatch: expected $EXPECTED_RUNTIME_SERVICE_ACCOUNT"
            exit 1
          fi

          env_value() {
            jq -er --arg name "$1" '[.spec.template.spec.containers[]?.env[]? | select(.name == $name)] | if length == 1 and (.[0].value | type) == "string" then .[0].value else empty end' <<<"$SERVICE_JSON"
          }
          secret_name() {
            jq -er --arg name "$1" '[.spec.template.spec.containers[]?.env[]? | select(.name == $name) | (.valueFrom.secretKeyRef.name // .valueSource.secretKeyRef.secret // empty)] | if length == 1 then .[0] else empty end' <<<"$SERVICE_JSON"
          }
          assert_env() {
            local name="$1" expected="$2" actual
            if ! actual=$(env_value "$name") || [[ "$actual" != "$expected" ]]; then
              echo "Auth runtime env mismatch for $name: expected $expected"
              exit 1
            fi
          }
          assert_env GCP_PROJECT "${{ env.PROJECT_ID }}"
          assert_env FIRESTORE_DATABASE_ID "llm-wiki-cloud-dev"
          assert_env ALLOWED_ORIGINS "https://wiki.dev.rayer.idv.tw,https://llm-wiki-frontend-dev.vercel.app,http://localhost:3000"
          assert_env ALLOWED_HOSTS "auth.dev.rayer.idv.tw,auth-dev.rayer.idv.tw"
          assert_env DEV_JWT "false"
          assert_env LWC_SOURCE_COMMIT "$COMMIT_SHA"
          RUNTIME_SOURCE_COMMIT=$(env_value LWC_SOURCE_COMMIT)
          if ! JWT_SECRET_REF=$(secret_name JWT_SECRET) || [[ "$JWT_SECRET_REF" != "jwt-secret-dev" ]]; then
            echo "Auth runtime JWT_SECRET is not a reference to jwt-secret-dev"
            exit 1
          fi

          if ! MAX_INSTANCES=$(jq -er '(.spec.template.metadata.annotations["autoscaling.knative.dev/maxScale"] // .spec.template.metadata.annotations["run.googleapis.com/maxScale"] // .spec.template.scaling.maxInstanceCount // .spec.template.spec.maxInstanceCount // empty) | tostring' <<<"$SERVICE_JSON") || [[ "$MAX_INSTANCES" != "1" ]]; then
            echo "Auth runtime max instances mismatch: expected 1"
            exit 1
          fi
          if ! INGRESS=$(jq -er '(.metadata.annotations["run.googleapis.com/ingress"] // .spec.ingress // "all") | tostring' <<<"$SERVICE_JSON") || [[ "$INGRESS" != "all" ]]; then
            echo "Auth runtime ingress mismatch: expected all"
            exit 1
          fi
          if ! VPC_EGRESS=$(jq -er '(.spec.template.metadata.annotations["run.googleapis.com/vpc-access-egress"] // .metadata.annotations["run.googleapis.com/vpc-access-egress"] // .spec.template.vpcAccess.egress // empty) | tostring' <<<"$SERVICE_JSON") || [[ "$VPC_EGRESS" != "private-ranges-only" ]]; then
            echo "Auth runtime VPC egress mismatch: expected private-ranges-only"
            exit 1
          fi
          if ! jq -e --arg revision "$NEW_REVISION" \
            '([.status.traffic[]? | select(.revisionName == $revision) | .percent] | length == 1 and .[0] == 100)' \
            <<<"$SERVICE_JSON" >/dev/null; then
            echo "Auth traffic read-back is not exactly 100% on the new revision"
            exit 1
          fi

          ROLLBACK_EVIDENCE="auth-rollback-evidence-$COMMIT_SHA.json"
          if ! jq -e '(.previous_serving_revision | type == "string") and (.previous_image | type == "string") and (.previous_version_commit | type == "string" and test("^[0-9a-f]{40}$"))' "$ROLLBACK_EVIDENCE" >/dev/null; then
            echo "Pre-deploy rollback evidence is missing or unreadable; refusing to publish evidence."
            exit 1
          fi
          jq \
            --arg new_revision "$NEW_REVISION" \
            --arg new_image "$DEPLOYED_IMAGE_DIGEST" \
            '.new_revision = $new_revision | .new_image = $new_image' \
            "$ROLLBACK_EVIDENCE" \
            > "$EVIDENCE_TMP"

          VERSION_BODY=$(mktemp)
          VERSION_HEADERS=$(mktemp)
          trap 'rm -f "$VERSION_BODY" "$VERSION_HEADERS"' EXIT
          HTTP_STATUS=$(curl -sS --max-time 20 --connect-timeout 10 \
            -H 'Cache-Control: no-cache' \
            -D "$VERSION_HEADERS" \
            -o "$VERSION_BODY" \
            -w '%{http_code}' \
            "https://$AUTH_DOMAIN/api/v1/public/version")
          if [[ "$HTTP_STATUS" != "200" ]]; then
            echo "Auth version read-back returned HTTP $HTTP_STATUS; refusing to publish evidence."
            exit 1
          fi
          CACHE_CONTROL=$(awk 'BEGIN{IGNORECASE=1} /^Cache-Control:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/[[:space:]]*\r$/, ""); print; exit}' "$VERSION_HEADERS")
          if [[ "${CACHE_CONTROL,,}" != "no-store" ]]; then
            echo "Auth version read-back Cache-Control mismatch: expected no-store"
            exit 1
          fi
          if ! jq -e --arg commit "$COMMIT_SHA" --arg service "$SERVICE_NAME" \
            --arg revision "$NEW_REVISION" \
            '.commit == $commit and .service == $service and .revision == $revision' "$VERSION_BODY" >/dev/null; then
            echo "Auth version read-back did not match the exact commit, service, and revision identity; refusing to publish evidence."
            exit 1
          fi
          HEALTH_STATUS=$(curl -sS --max-time 20 --connect-timeout 10 -o /dev/null -w '%{http_code}' "https://$AUTH_DOMAIN/api/v1/public/healthz")
          if [[ "$HEALTH_STATUS" != "200" ]]; then
            echo "Auth healthz read-back returned HTTP $HEALTH_STATUS"
            exit 1
          fi
          jq --arg commit "$COMMIT_SHA" --arg service "$SERVICE_NAME" --arg revision "$NEW_REVISION" --arg runtime_source_commit "$RUNTIME_SOURCE_COMMIT" --arg status "$HTTP_STATUS" --arg health_status "$HEALTH_STATUS" \
            --arg runtime_service_account "$RUNTIME_SERVICE_ACCOUNT" --arg max_instances "$MAX_INSTANCES" --arg ingress "$INGRESS" --arg vpc_egress "$VPC_EGRESS" \
            '.exact_commit = $commit | .readback_service = $service | .readback_revision = $revision | .runtime_source_commit = $runtime_source_commit | .version_http_status = ($status | tonumber) | .healthz_http_status = ($health_status | tonumber) | .runtime_service_account = $runtime_service_account | .max_instances = ($max_instances | tonumber) | .ingress = $ingress | .vpc_egress = $vpc_egress | .jwt_secret_name = "jwt-secret-dev" | .runtime_env = {GCP_PROJECT: "llm-wiki-cloud", FIRESTORE_DATABASE_ID: "llm-wiki-cloud-dev", ALLOWED_ORIGINS: "https://wiki.dev.rayer.idv.tw,https://llm-wiki-frontend-dev.vercel.app,http://localhost:3000", ALLOWED_HOSTS: "auth.dev.rayer.idv.tw,auth-dev.rayer.idv.tw", DEV_JWT: "false"}' \
            "$EVIDENCE_TMP" > "$EVIDENCE_TMP.final"
          mv "$EVIDENCE_TMP.final" "$EVIDENCE"
          echo "evidence=$EVIDENCE" >> "$GITHUB_OUTPUT"

      - name: Upload Auth deployment evidence
        if: steps.strict_verify.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: auth-deployment-evidence-${{ steps.identity.outputs.git_sha }}
          path: auth-deployment-evidence-${{ steps.identity.outputs.git_sha }}.json
          if-no-files-found: error
          retention-days: 90

      - name: Reconcile Auth deployment outcome
        if: always()
        id: reconcile
        env:
          AR_REPO: ${{ env.AR_REPO }}
          SERVICE_NAME: ${{ env.SERVICE_NAME }}
          EVIDENCE_ID: ${{ steps.source.outputs.candidate_sha || format('run-{0}', github.run_id) }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          STRICT_OUTCOME: ${{ steps.strict_verify.outcome }}
        run: |
          set +e
          if [[ ! "$EVIDENCE_ID" =~ ^([0-9a-f]{40}|run-[0-9]+)$ ]]; then
            echo "invalid reconciliation evidence identity"
            exit 1
          fi
          RECONCILIATION="auth-deployment-reconciliation-$EVIDENCE_ID.json"
          HEADERS=$(mktemp)
          VERSION_BODY=$(mktemp)
          trap 'rm -f "$HEADERS" "$VERSION_BODY"' EXIT

          SERVICE_JSON=""
          PROVIDER_READBACK_AVAILABLE=false
          if SERVICE_JSON=$(gcloud run services describe "$SERVICE_NAME" \
            --region "${{ env.REGION }}" --project "${{ env.PROJECT_ID }}" --format=json --quiet 2>/dev/null); then
            if jq -e 'type == "object"' <<<"$SERVICE_JSON" >/dev/null 2>&1; then
              PROVIDER_READBACK_AVAILABLE=true
            else
              SERVICE_JSON=""
            fi
          fi
          ACTUAL_TRAFFIC=$(jq -c '[.status.traffic[]? | {revisionName: (.revisionName // null), percent: (.percent // null), tag: (.tag // null), latestRevision: (.latestRevision // null)}]' <<<"$SERVICE_JSON" 2>/dev/null)
          [[ "$ACTUAL_TRAFFIC" =~ ^\[ ]] || ACTUAL_TRAFFIC='[]'
          LATEST_CREATED_REVISION=$(jq -cer '.status.latestCreatedRevisionName // ""' <<<"$SERVICE_JSON" 2>/dev/null)
          [[ "$LATEST_CREATED_REVISION" == "null" ]] && LATEST_CREATED_REVISION=""

          SERVING_REVISIONS='[]'
          while IFS= read -r revision; do
            [[ "$revision" =~ ^[a-z][a-z0-9-]{0,61}[a-z0-9]$ ]] || continue
            if REVISION_JSON=$(gcloud run revisions describe "$revision" --region "${{ env.REGION }}" --project "${{ env.PROJECT_ID }}" --format=json --quiet 2>/dev/null); then
              IMAGE=$(jq -er '.status.imageDigest // empty' <<<"$REVISION_JSON" 2>/dev/null)
              if [[ "$IMAGE" =~ ^${AR_REPO}/llm-wiki-auth@sha256:[0-9a-f]{64}$ ]]; then
                ROW=$(jq -nc --arg revision "$revision" --arg image "$IMAGE" '{revisionName: $revision, image: $image}')
                SERVING_REVISIONS=$(jq -c --argjson row "$ROW" '. + [$row]' <<<"$SERVING_REVISIONS")
              fi
            fi
          done < <(jq -r '.status.traffic[]?.revisionName // empty' <<<"$SERVICE_JSON" 2>/dev/null)

          VERSION_STATUS=000
          CACHE_CONTROL=""
          VERSION_FIELDS='{}'
          if VERSION_STATUS=$(curl -sS --max-time 20 --connect-timeout 10 -H 'Cache-Control: no-cache' -D "$HEADERS" -o "$VERSION_BODY" -w '%{http_code}' "https://${{ env.AUTH_DOMAIN }}/api/v1/public/version" 2>/dev/null); then
            CACHE_CONTROL=$(awk 'BEGIN{IGNORECASE=1} /^Cache-Control:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/[[:space:]]*\r$/, ""); print; exit}' "$HEADERS")
            VERSION_FIELDS=$(jq -c '{commit: (.commit // null), service: (.service // null), revision: (.revision // null)}' "$VERSION_BODY" 2>/dev/null)
            [[ "$VERSION_FIELDS" =~ ^\{ ]] || VERSION_FIELDS='{}'
          else
            VERSION_STATUS=000
          fi
          HEALTH_STATUS=$(curl -sS --max-time 20 --connect-timeout 10 -o /dev/null -w '%{http_code}' "https://${{ env.AUTH_DOMAIN }}/api/v1/public/healthz" 2>/dev/null)
          [[ "$HEALTH_STATUS" =~ ^[0-9]{3}$ ]] || HEALTH_STATUS=000

          if ! jq -n \
            --arg service "$SERVICE_NAME" \
            --arg deploy "$DEPLOY_OUTCOME" \
            --arg strict "$STRICT_OUTCOME" \
            --argjson provider "$PROVIDER_READBACK_AVAILABLE" \
            --arg latest_created_revision "$LATEST_CREATED_REVISION" \
            --argjson traffic "$ACTUAL_TRAFFIC" \
            --argjson serving_revisions "$SERVING_REVISIONS" \
            --arg version_status "$VERSION_STATUS" \
            --arg cache_control "$CACHE_CONTROL" \
            --argjson version_fields "$VERSION_FIELDS" \
            --arg health_status "$HEALTH_STATUS" \
            '{evidence: "reconciliation", service: $service, provider_readback_available: $provider, latest_created_revision: $latest_created_revision, http_readback_available: ($version_status != "000" or $health_status != "000"), actual_traffic: $traffic, actual_serving_revisions: $serving_revisions, version_http_status: ($version_status | if . == "000" then null else tonumber end), version_cache_control: $cache_control, version: $version_fields, healthz_http_status: ($health_status | if . == "000" then null else tonumber end), steps: {deploy: $deploy, strict_verify: $strict}}' \
            > "$RECONCILIATION"; then
            echo "Unable to materialize Auth deployment reconciliation evidence; refusing to publish."
            exit 1
          fi
          if [[ ! -s "$RECONCILIATION" ]]; then
            echo "Auth deployment reconciliation evidence is missing or empty; refusing to publish."
            exit 1
          fi
          echo "evidence_id=$EVIDENCE_ID" >> "$GITHUB_OUTPUT"
          echo "reconciliation=$RECONCILIATION" >> "$GITHUB_OUTPUT"

      - name: Upload Auth deployment reconciliation
        if: ${{ always() && steps.reconcile.outputs.evidence_id != '' && steps.reconcile.outputs.reconciliation != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: auth-deployment-reconciliation-${{ steps.reconcile.outputs.evidence_id }}
          path: ${{ steps.reconcile.outputs.reconciliation }}
          if-no-files-found: error
          retention-days: 90

      - name: Persist Auth image receipt
        id: image_digest
        env:
          AR_REPO: ${{ env.AR_REPO }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          COMMIT_SHA="${{ steps.identity.outputs.git_sha }}"
          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "built commit SHA must be a 40-character lowercase commit SHA"
            exit 1
          fi
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Cloud Build image digest is missing or invalid"
            exit 1
          fi
          DIGEST_FILE="auth-image-digest-$COMMIT_SHA.txt"
          printf '%s\n' \
            "receipt_schema_version=1" \
            "component=lwc-auth" \
            "build_ref=develop" \
            "source_sha=$COMMIT_SHA" \
            "dev_run_id=$GITHUB_RUN_ID" \
            "image_digest=$DIGEST" \
            "image_reference=$AR_REPO/llm-wiki-auth@$DIGEST" \
            > "$DIGEST_FILE"
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "receipt_file=$DIGEST_FILE" >> "$GITHUB_OUTPUT"
          echo "Persisted exact Auth image receipt for $COMMIT_SHA ($DIGEST)"

      - name: Upload Auth image receipt
        uses: actions/upload-artifact@v4
        with:
          name: auth-image-digest-${{ steps.image_digest.outputs.commit_sha }}
          path: ${{ steps.image_digest.outputs.receipt_file }}
          if-no-files-found: error

      - name: Tag deployed dev image (fail-closed)
        env:
          IMMUTABLE_IMAGE: ${{ env.AR_REPO }}/llm-wiki-auth@${{ steps.image_digest.outputs.digest }}
        run: |
          set -euo pipefail
          DEV_IMAGE_TAG="${{ env.AR_REPO }}/llm-wiki-auth:dev-${{ steps.identity.outputs.git_sha }}"
          gcloud artifacts docker tags add \
            "$IMMUTABLE_IMAGE" \
            "$DEV_IMAGE_TAG" \
            --quiet

      - name: Show deployment info
        run: |
          gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --format="value(status.url)"
